<!--
  S11 (Task 7 of docs/plans/2026-10-20-night-map-deck.md, storyboard v4), on the shared world (A2 city,
  deck/shared/world/SCENE_BRIEF.md). Ported from design-demos/round2/2-benchmark-light/s11.html.
    s0  S10's end without its questions (S09-end, the world dimmed), the land brought up: the title and the three
        environment totals on the land, at camera full
    s1  the camera flies to the land (camera "land"); the whole volume in neutral light: 2,780 GB, 123,860 files;
        the environment readouts under the land (total per environment), each tied to its territory by a faint seam
        on the land and a tick down the coast
    s2  used by apps people use: 674 GB, 24 %, 2,773 files, 2 % (the readouts' bars start splitting by category)
    s3  the rest, by kind: read only by apps nobody opens, written never read, no sign of use (all four columns)
    s4  the age filter: the 6-month contour wraps every region older than 6 months (key "older than 6 months"),
        then turns --review and the unused ones lift out inside the land's outline (key "unused and 6+ months
        old"): 1,278 GB in --key = 488 GB + 790 GB unchanged for 6+ months; the readouts switch to the first round
        per environment
    s5  100 GB drawn at the land's scale: more than ten times the space we usually have free
    s6  A and B, for real: every old in-use field glows, rings on A's three largest places; the never-read fields
        lit, B's ring on the largest one near its callout; one leader each, clear of the other's marks
  The scene ends on camera "land" with the first round, the PII line and the readouts per environment (S12 starts
  from land). A and B leave at s7: the plan's contract row says "first round, A/B, PII"; the cleaner end is a
  deliberate deviation (S11 end -> S12 s0 measured 5.9 % mean difference, soft). On day, each material is named on the land at s3 (theme.js: the pairs fail CVD on paper).
    s7  the PII line (GCP: 471 files)
  Numbers: computed from TRUTH.qvd_files.age_table_mb and asserted against the plan's table (console.assert).
  Colours: THEME tokens / theme.js variables only (python qa/lint_colors.py).
-->

<style>
  body.scene { background: var(--stage); color: var(--ink); }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--stage); }
  #ws { position: absolute; inset: 0; }

  /* ---- the hero zone (left of the key): the total, then the first round. Rows shared with the key:
     number 146-296 (caps from ~168), row A 298-332 (= the key's files row), row B 342-376 */

  .hero .n { font-size: 150px; line-height: 150px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink);
    font-variant-numeric: lining-nums tabular-nums; }

  /* the hero's own dark plate (over the lit land it measured 2.90:1: plan, Task 4) */

  #heroRound .plate { position: absolute; left: -20px; top: 10px; width: 520px; height: 128px; border-radius: 22px; z-index: -1;
    background: color-mix(in srgb, var(--stage) 88%, transparent);
    box-shadow: 0 0 24px 14px color-mix(in srgb, var(--stage) 88%, transparent); }

  /* ---- the key: one column per category (size, share of size, files, share of files) */
  .col { top: 166px; width: 226px; height: 240px; }

  .col canvas { top: 0; width: 226px; height: 12px; border-radius: 2px; }

  /* ---- environment readouts under the land: total -> per category (bar) -> first round */
  .env { top: 860px; white-space: nowrap; }
  .env .l1, .env .l2 { position: relative; height: 34px; font-size: 28px; line-height: 34px; }
  .env .l1 { color: var(--ink); }
  .env .l1 b { font-weight: 700; }
  .env .l2 { color: var(--ink-dim); }
  .env .v { position: absolute; left: 0; top: 0; }
  .env .fr i { display: inline-block; width: 18px; height: 18px; border: 3px solid var(--review); border-radius: 2px;
    box-sizing: border-box; margin: 0 10px 0 0; vertical-align: -1px;
    background: color-mix(in srgb, var(--review) 22%, transparent); }
  .env .bar { position: relative; margin-top: 10px; height: 12px; }
  .env .bar i { position: absolute; top: 0; height: 12px; display: block; transform-origin: 0 50%; }
  .env .bar .base { left: 0; background: color-mix(in srgb, var(--ink-faint) 34%, transparent); border-radius: 2px; }

  .env .bar .seg-fr { left: 0; top: -5px; height: 22px; box-sizing: border-box; border: 3px solid var(--review); border-radius: 3px;
    background: color-mix(in srgb, var(--review) 30%, var(--stage)); }

  /* ---- 100 GB at the land's scale, and its sentence */
  #free { position: absolute; left: 848px; top: 166px; box-sizing: border-box; border: 3px dashed var(--ink);
    background: color-mix(in srgb, var(--ink) 8%, transparent); }
  #free span { position: absolute; left: 12px; bottom: 8px; font-size: 28px; line-height: 32px; font-weight: 700; color: var(--ink); }
  #freeTxt { top: 166px; white-space: nowrap; }
  #freeTxt .a { font-size: 26px; line-height: 34px; color: var(--ink-dim); }
  #freeTxt .b { margin-top: 10px; font-size: 34px; line-height: 42px; font-weight: 500; color: var(--ink); }
  #freeTxt .b b { font-weight: 700; }

  /* ---- labels on the land */
  #ageLbl, #matLbls .w-label { position: absolute; left: 0; top: 0; }
  /* day only: a plate of paper under each material's name and under the age key (the day label has a halo only,
     too weak on texture) */
  #matLbls .w-label, [data-theme="day"] #ageLbl { padding: 0 10px; border-radius: 8px; background: color-mix(in srgb, var(--stage) 90%, transparent);
    box-shadow: 0 0 10px 4px color-mix(in srgb, var(--stage) 70%, transparent); }
  /* the age key: a swatch of the contour (white, then --review as the first round lifts) and its words */
  #ageLbl { display: flex; align-items: center; }
  #ageLbl .sw { position: relative; flex: none; width: 18px; height: 18px; margin-right: 10px; box-sizing: border-box;
    border: 3px solid var(--ink); border-radius: 2px; background: color-mix(in srgb, var(--ink) 14%, transparent); }
  #ageLbl .sw i { position: absolute; inset: -3px; box-sizing: border-box; border: 3px solid var(--review); border-radius: 2px;
    background: color-mix(in srgb, var(--review) 22%, var(--stage)); }
  #ageLbl .ks { display: inline-grid; }

  /* ---- A and B, for real; PII */
  .call { top: 166px; width: 470px; font-size: 26px; line-height: 32px; color: var(--ink-dim); white-space: normal; }
  .call .h { display: flex; align-items: center; font-size: 28px; line-height: 36px; font-weight: 700; color: var(--ink); }
  .call .h i { font-style: normal; display: inline-block; width: 40px; height: 40px; line-height: 40px; text-align: center;
    border-radius: 50%; margin-right: 14px; font-size: 26px; font-weight: 700; color: var(--stage); flex: none; }
  .call .big { margin-top: 4px; font-size: 44px; line-height: 50px; font-weight: 700; color: var(--ink); }
  .call .tx { margin-top: 4px; }
  #pii { width: 820px; }

  #pii .tx { margin-top: 10px; font-size: 30px; line-height: 40px; color: var(--ink-dim); }
  #pii .tx b { color: var(--ink); font-weight: 700; }
  svg.hudsvg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }

<div id="stage">

  <div id="hud">

<script>
const R = window.WorldRender, T = window.THEME, W = window.WORLD, TR = window.TRUTH;
const $ = (s) => document.querySelector(s);
const E = R.MOTION;
const NS = "http://www.w3.org/2000/svg";
$("#icon").src = T.icon;

/* ================================================================ numbers (truth.json, asserted) */
const ROWS = TR.qvd_files.age_table_mb.rows;              // [env, usage, age, files, mb]
const ENVS = ["On-prem", "GCP", "AWS"], CATS = ["valid", "unused_apps", "never_read", "no_sign"];
const OLD = (age) => age === "6-8" || age === "9-11" || age === "12+";
const ROUND = (r) => (r[1] === "unused_apps" || r[1] === "no_sign") && OLD(r[2]);
const sum = (f) => ROWS.filter(f).reduce((a, r) => [a[0] + r[3], a[1] + r[4]], [0, 0]);   // [files, mb]
const TOT = sum(() => true);
const N = { total: { gb: Math.round(TOT[1] / 1000), files: TOT[0] }, cat: {}, env: {}, envCat: {}, round: {}, roundEnv: {} };
for (const u of CATS) {
  const s = sum((r) => r[1] === u);
  N.cat[u] = { gb: Math.round(s[1] / 1000), pctSize: Math.round(100 * s[1] / TOT[1]), files: s[0], pctFiles: Math.round(100 * s[0] / TOT[0]) };
}
for (const e of ENVS) {
  const s = sum((r) => r[0] === e);
  N.env[e] = { gb: Math.round(s[1] / 1000), files: s[0], mb: s[1] };
  N.envCat[e] = {};
  for (const u of CATS) N.envCat[e][u] = sum((r) => r[0] === e && r[1] === u)[1];
  const fr = sum((r) => r[0] === e && ROUND(r));
  N.roundEnv[e] = { gb: Math.round(fr[1] / 100) / 10, files: fr[0], mb: fr[1] };
}
for (const u of ["unused_apps", "no_sign", "never_read"]) N.round[u] = Math.round(sum((r) => r[1] === u && OLD(r[2]))[1] / 1000);
const RT = sum(ROUND);
N.round.gb = Math.round(RT[1] / 1000); N.round.files = RT[0];
N.a = sum((r) => r[1] === "valid" && OLD(r[2]));
// the plan's table (Task 7, Seba 2026-10-20): every number on screen, asserted against the rows
{
  const ok = (c, m) => console.assert(c, "S11 number: " + m);
  const P = { valid: [674, 24, 2773, 2], unused_apps: [885, 32, 31247, 25], never_read: [210, 8, 6688, 5], no_sign: [1011, 36, 83152, 67] };
  for (const u of CATS) { const c = N.cat[u], p = P[u]; ok(c.gb === p[0] && c.pctSize === p[1] && c.files === p[2] && c.pctFiles === p[3], u); }
  ok(N.total.gb === 2780 && N.total.files === 123860 && N.total.files === TR.qvd_files.total_files, "total");
  const PE = { "On-prem": [1472, 85831, 744.6, 51901], GCP: [940, 30487, 382.7, 10570], AWS: [368, 7542, 150.9, 4302] };
  for (const e of ENVS) ok(N.env[e].gb === PE[e][0] && N.env[e].files === PE[e][1] && N.roundEnv[e].gb === PE[e][2] && N.roundEnv[e].files === PE[e][3], e);
  for (const b of TR.qvd_files.first_round.by_env) ok(N.roundEnv[b.env].gb === b.gb && N.roundEnv[b.env].files === b.files, "first round " + b.env);
  ok(N.round.unused_apps === 488 && N.round.no_sign === 790 && N.round.never_read === 0 && N.round.gb === 1278
    && N.round.files === 66773 && N.round.files === TR.qvd_files.first_round.files, "first round");
  ok(N.a[0] === TR.qvd_files.file_a_for_real.files && Math.round(N.a[1] / 100) / 10 === TR.qvd_files.file_a_for_real.gb, "file A");
  ok(N.cat.never_read.files === TR.qvd_files.file_b_for_real.files, "file B");
  for (const b of TR.qvd_files.by_usage) ok(N.cat[b.key].files === b.files && N.cat[b.key].pctSize === b.share_pct_size, "by_usage " + b.key);
  ok(TR.qvd_files.pii_gcp.files === 471, "PII");
}
const fmt = (n) => n.toLocaleString("en-GB");
const fmt1 = (n) => n.toLocaleString("en-GB", { minimumFractionDigits: 1, maximumFractionDigits: 1 });

/* ================================================================ the land's geometry at camera "land" */
const CL = R.camera("land"), Z = CL.scale;
const S = (p) => [CL.x + Z * p[0], CL.y + Z * p[1]];            // world -> screen at camera land
const LBB = R.bb(W.land.poly);
// the land's canvases cover this world rect, pixel aligned on screen at camera land; res = the zoom, so they stay
// sharp where the scene rests
const LR = (() => {
  const sx = Math.floor(CL.x + Z * (LBB[0] - 6)), sy = Math.floor(CL.y + Z * (LBB[1] - 6));
  const ex = Math.ceil(CL.x + Z * (LBB[2] + 6)), ey = Math.ceil(CL.y + Z * (LBB[3] + 6));
  return { x: (sx - CL.x) / Z, y: (sy - CL.y) / Z, w: (ex - sx) / Z, h: (ey - sy) / Z, pw: ex - sx, ph: ey - sy, sx, sy };
})();
const lx = (p) => [(p[0] - LR.x) * Z, (p[1] - LR.y) * Z];          // world -> land canvas px

/* ================================================================ the land's materials (THEME only) */
const CATC = { valid: T.inUse, unused_apps: T.unusedApps, never_read: T.neverRead, no_sign: T.noSign };
// lum: the marks' light; g: the share of the colour in the field's ground. In use a little lower than round 2
// (lum 0.78, bloom 0.55) so it reads as light, not neon (controller call, pending Seba)
const MAT = { valid: { lum: 0.5, g: 0.15 }, unused_apps: { lum: 0.6, g: 0.22 }, never_read: { lum: 0.5, g: 0.2 }, no_sign: { lum: 0.4, g: 0.26 } };
const IN_USE_BLOOM = 0.34;
const STG = T.channels(T.stage);
const mix = (c, k) => T.channels(c).map((v, i) => Math.max(0, Math.min(255, Math.round(v * k + STG[i] * (1 - k)))));
const shade = (() => { const r = R.mulberry32(77), m = {}; for (const c of W.land.containers) m[c.id] = r(); return (id) => m[id]; })();
const GRAIN = { minTile: 3.4 * Z, minGrain: 2.0 * Z, gap: 0.8 * Z, gapK: 0.32, dotK: 0.5, cover: 0.7, jx: 0.5, jy: 0.08 };
function mat(u, ct, o = {}) {
  const v = ((ct ? shade(ct.id) : 0.5) - 0.5) * 0.2, g = mix(CATC[u], (o.g ?? MAT[u].g) * (1 + v));
  return Object.assign({ ground: T.rgb(g), rgb: T.channels(CATC[u]).join(","), lum: o.lum ?? MAT[u].lum, add: false }, GRAIN);
}
// the land as the map draws it (world.js map(): "dark" at S04-S10, "lit" = the neutral light of s1)
function terrain(D, lum) {
  return (cl, ct) => {
    const v = shade(ct.id), G = D.ground, g0 = G.base + v * G.span * T.texture.shade;
    return Object.assign({ ground: T.rgb([(g0 + G.tint[0]) | 0, (g0 + G.tint[1]) | 0, (g0 + G.tint[2]) | 0]), rgb: D.mark, lum, add: false }, GRAIN);
  };
}

/* ================================================================ canvases (drawn once, frozen before Scene.init) */
const lumOf = (c) => T.channels(c).reduce((a, v) => a + v, 0);
const SHADOW = lumOf(T.stage) < lumOf(T.ink) ? T.stage : T.ink;     // the darker of the two, on both themes
function cv() { const c = document.createElement("canvas"); c.width = LR.pw; c.height = LR.ph; return c; }
function drawLand(c, style, opt = {}) {
  const g = c.getContext("2d");
  if (opt.base) { R.path(g, W.land.poly, lx); g.fillStyle = opt.base; g.fill(); }
  R.land(g, { xf: lx, s: Z, gap: R.HAIR * Z, terrGap: 3.4 * Z, gapColor: opt.gapColor || T.lit.gap, style });
  if (opt.rim) { R.path(g, W.land.poly, lx); g.lineWidth = R.HAIR * Z; g.strokeStyle = opt.rim; g.stroke(); }
  return c;
}
const cells = (pick) => W.land.containers.flatMap((ct) => ct.cells.filter((cl) => pick(cl, ct)));
const polysOf = (pick) => cells(pick).map((cl) => cl.poly);
const bloomOf = (c, pick) => R.bloomCells(c.getContext("2d"), polysOf(pick), T.inUse, IN_USE_BLOOM, 12, LR, Z);
const isRound = (cl) => cl.part === "old" && (cl.u === "unused_apps" || cl.u === "no_sign");
const isValid = (cl) => cl.u === "valid";
// a union's outline: every polygon stroked 2w wide, interiors erased (shared edges vanish), clipped to the land
function outline(c, polys, colour, w) {
  const g = c.getContext("2d");
  g.lineJoin = "round"; g.lineCap = "round";
  for (const p of polys) { R.path(g, p, lx); g.lineWidth = 2 * w; g.strokeStyle = colour; g.stroke(); }
  g.globalCompositeOperation = "destination-out";
  for (const p of polys) { R.path(g, p, lx); g.fillStyle = T.rgb(T.stage); g.fill(); }
  g.globalCompositeOperation = "destination-in"; R.path(g, W.land.poly, lx); g.fillStyle = T.rgb(T.stage); g.fill();
  g.globalCompositeOperation = "source-over";
  return c;
}

const L = {};
L.dark = drawLand(cv(), terrain(T.dark, 0.085), { base: T.dark.fill, rim: T.dark.rim, gapColor: T.dark.gap });
L.neutral = drawLand(cv(), terrain(T.lit, 0.13), { base: T.lit.fill, rim: T.lit.rim });
L.valid = drawLand(cv(), (cl, ct) => (isValid(cl) ? mat("valid", ct) : null)); bloomOf(L.valid, isValid);
for (const u of ["unused_apps", "never_read", "no_sign"]) L[u] = drawLand(cv(), (cl, ct) => (cl.u === u ? mat(u, ct) : null));
L.use = drawLand(cv(), (cl, ct) => mat(cl.u, ct), { base: T.lit.fill, rim: T.lit.rim }); bloomOf(L.use, isValid);
// the first round carved out: sockets of the stage where its plates were
const SOCKET = Object.assign({ ground: T.rgb(T.stage), rgb: T.channels(T.stage).join(","), lum: 0, add: false }, GRAIN);
L.sock = drawLand(cv(), (cl, ct) => (isRound(cl) ? SOCKET : mat(cl.u, ct)), { base: T.lit.fill, rim: T.lit.rim }); bloomOf(L.sock, isValid);
L.dim = cv(); { const g = L.dim.getContext("2d"); R.path(g, W.land.poly, lx); g.fillStyle = T.rgba(T.stage, 0.6); g.fill(); }
// the 6-month contour: the outline of every region older than 6 months (the land's age is a mosaic, not a band)
L.age = outline(cv(), polysOf((cl) => cl.part === "old"), T.rgb(T.ink), 2.5);
L.shadow = cv(); { const g = L.shadow.getContext("2d"); g.filter = "blur(8px)"; g.fillStyle = T.rgba(SHADOW, SHADOW === T.stage ? 0.95 : 0.32);
  for (const p of polysOf(isRound)) { R.path(g, p, lx); g.fill(); } g.filter = "none"; }
L.plate = drawLand(cv(), (cl, ct) => (isRound(cl) ? mat(cl.u, ct, { lum: Math.min(1, MAT[cl.u].lum * 1.25), g: MAT[cl.u].g * 1.4 }) : null));
// the rim (--review): the same contour, for the first round only, slivers too small to read as a plate left out
L.rim = outline(cv(), cells((cl) => isRound(cl) && R.area(cl.poly.map(lx)) > 60).map((cl) => cl.poly), T.rgb(T.review), 2.5);

  const WIPE0 = "inset(0% 100% 0% 0%)", WIPE1 = "inset(0% 0% 0% 0%)";
  gsap.set([L.valid, L.unused_apps, L.never_read, L.no_sign], { clipPath: WIPE0 });
  // day only: each material named on the land at s3 (theme.js: on paper the pairs fail CVD, no sign is 1.87:1)
  const matLbls = [];

    const used = [];
    for (const u of CATS) {
      const pick = cells((cl) => cl.u === u).map((cl) => ({ q: cl.poly.map(S) })).map((o) => Object.assign(o, { a: R.area(o.q), c: R.centroid(o.q) }))

      matLbls.push(d);

  }

  const tl = gsap.timeline({ paused: true, defaults: { ease: E.rise } });
  tl.addLabel("s0", 0);
  const rise = (el, at, d = 0.7, y = 12) => tl.fromTo(el, { autoAlpha: 0, y }, { autoAlpha: 1, y: 0, duration: d, immediateRender: false }, at);

  // s1: to the land; the whole volume in neutral light, its total and the environments' totals
  let t = 0;

  tl.to([h.layers.known, h.layers.bridged], { autoAlpha: 0, duration: 0.35, ease: E.light }, t);
  tl.to(h.world, { ...R.camera("land"), duration: 1.8, ease: E.dolly }, t + 0.1);
  tl.to([fadeTop, fadeBot], { autoAlpha: 1, duration: 0.9, ease: E.light }, t + 1.0);

  ENVS.forEach((e, i) => rise(ENV[e], t + 2.0 + i * 0.08));
  tl.to(gSeam, { autoAlpha: 1, duration: 0.6, ease: E.light }, t + 2.0);
  tl.addLabel("s1", t + 2.8);

  // s2: what apps people use read lights up (and only that)
  t += 2.9;
  tl.to(L.valid, { autoAlpha: 1, duration: 0.3, ease: E.light }, t);
  tl.to(L.valid, { clipPath: WIPE1, duration: 1.0, ease: E.beam }, t);
  tl.to(L.neutral, { autoAlpha: 0.5, duration: 0.8, ease: E.light }, t);
  rise("#c0", t + 0.3);
  tl.to(".env .seg-valid", { scaleX: 1, duration: 0.7, ease: E.slide }, t + 0.4);
  tl.addLabel("s2", t + 1.6);

  // s3: the rest, by kind: read only by apps nobody opens, written and never read, no sign of use
  t += 1.7;
  ["unused_apps", "never_read", "no_sign"].forEach((u, i) => {
    tl.to(L[u], { autoAlpha: 1, duration: 0.25, ease: E.light }, t + i * 0.7);
    tl.to(L[u], { clipPath: WIPE1, duration: 0.8, ease: E.beam }, t + i * 0.7);
    rise("#c" + (i + 1), t + i * 0.7 + 0.1);
    tl.to(".env .seg-" + u, { scaleX: 1, duration: 0.6, ease: E.slide }, t + i * 0.7 + 0.15);
  });
  tl.set(L.use, { autoAlpha: 1 }, t + 2.25);
  tl.set([L.neutral, L.valid, L.unused_apps, L.never_read, L.no_sign], { autoAlpha: 0 }, t + 2.26);
  if (matLbls.length) tl.to(matLbls, { autoAlpha: 1, duration: 0.4, ease: E.light, stagger: 0.06 }, t + 1.9);
  tl.addLabel("s3", t + 2.5);

  // s4: the age filter. The contour wraps every region older than 6 months; it turns --review on the unused ones,
  // which lift out of every container (the first round); the rest dims; the hero turns to 1,278 GB
  t += 2.6;
  if (matLbls.length) tl.to(matLbls, { autoAlpha: 0, duration: 0.35, ease: E.light }, t);
  tl.to(L.age, { autoAlpha: 1, duration: 0.2, ease: "none" }, t);
  tl.to(L.age, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.1, ease: E.beam }, t);
  tl.fromTo("#ageLbl", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: E.light, immediateRender: false }, t + 0.7);
  t += 1.5;
  tl.to(L.rim, { autoAlpha: 1, duration: 0.45, ease: E.light }, t);
  tl.to(L.age, { autoAlpha: 0, duration: 0.45, ease: E.light }, t);
  // the key follows the contour: white "older than 6 months" -> --review "unused and 6+ months old" (storyboard)
  tl.to("#ageLbl .sw i", { autoAlpha: 1, duration: 0.45, ease: E.light }, t);
  tl.to("#ageLbl .k1", { autoAlpha: 0, duration: 0.3, ease: E.light }, t);
  tl.to("#ageLbl .k2", { autoAlpha: 1, duration: 0.45, ease: E.light }, t + 0.2);
  t += 0.4;
  tl.set([L.sock, L.plate], { autoAlpha: 1 }, t); tl.set(L.use, { autoAlpha: 0 }, t + 0.01);
  tl.to(lift, { x: -8 / Z, y: -16 / Z, duration: 0.9, ease: E.lift }, t + 0.05);
  tl.fromTo(L.shadow, { autoAlpha: 0, x: 0, y: 0 }, { autoAlpha: 1, x: 3 / Z, y: 6 / Z, duration: 0.9, ease: E.lift, immediateRender: false }, t + 0.05);
  tl.to(L.dim, { autoAlpha: 1, duration: 0.8, ease: E.light }, t + 0.2);
  tl.to(["#c0", "#c2"], { autoAlpha: 0.3, duration: 0.45 }, t + 0.2);
  tl.fromTo(".col .fr", { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.6, immediateRender: false }, t + 0.7);
  tl.to("#heroAll", { autoAlpha: 0, y: -8, duration: 0.45, ease: E.light }, t + 0.5);
  tl.fromTo("#heroRound", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.8, immediateRender: false }, t + 0.9);
  tl.to(".env .tot", { autoAlpha: 0, duration: 0.35, ease: E.light }, t + 1.1);
  tl.to(".env .fr", { autoAlpha: 1, duration: 0.5, ease: E.light }, t + 1.35);
  tl.to(".env .seg, .env .base", { opacity: 0.3, duration: 0.5, ease: E.light }, t + 1.2);
  tl.to(".env .seg-fr", { autoAlpha: 1, duration: 0.2, ease: "none" }, t + 1.35);
  tl.to(".env .seg-fr", { scaleX: 1, duration: 0.7, ease: E.slide }, t + 1.35);
  tl.addLabel("s4", t + 2.2);

  // s5: for context, what we usually have free, at the land's scale
  t += 2.3;
  tl.to(["#c0", "#c1", "#c2", "#c3"], { autoAlpha: 0, duration: 0.35 }, t);
  tl.fromTo("#free", { autoAlpha: 0, scale: 0.5 }, { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.6, ease: E.kindle, immediateRender: false }, t + 0.25);
  rise("#freeTxt", t + 0.45, 0.6, 8);

  // s6: the opening puzzle with real numbers: A is old but read, B is never read but young
  t += 1.3;
  tl.to(["#free", "#freeTxt"], { autoAlpha: 0, duration: 0.4 }, t);
  tl.to([L.plate, L.shadow], { autoAlpha: 0.35, duration: 0.6 }, t); tl.to(L.rim, { autoAlpha: 0.4, duration: 0.6 }, t);
  rise("#callA", t + 0.3);
  tl.to(L.Aglow, { autoAlpha: 1, duration: 0.6, ease: E.light }, t + 0.45);
  tl.to(gA, { autoAlpha: 1, duration: 0.5, ease: E.kindle }, t + 0.55);
  rise("#callB", t + 1.0);
  tl.to(L.Bglow, { autoAlpha: 1, duration: 0.7, ease: E.light }, t + 1.15);
  tl.to(gB, { autoAlpha: 1, duration: 0.5, ease: E.light }, t + 1.35);

  // s7: not only space: 471 old files from apps that declare PII data, in GCP's first round
  t += 2.2;
  tl.to([L.Bglow, L.Aglow, gA, gB, "#callA", "#callB"], { autoAlpha: 0, duration: 0.5 }, t);
  tl.to([L.plate, L.shadow], { autoAlpha: 0.6, duration: 0.5 }, t); tl.to(L.rim, { autoAlpha: 0.7, duration: 0.5 }, t);

  tl.addLabel("s7", t + 1.6);

  await $("#icon").decode().catch(() => {});
  window.__s11 = { h, N, L, Z, LR };
  Scene.init(tl, ["s0", "s1", "s2", "s3", "s4", "s5", "s6", "s7"]);
})();
