<!--
  S10 (Task 9 of docs/plans/2026-10-20-night-map-deck.md; storyboard v4 S10, 10:15-10:30, the index of Act 3).
  Say: "Back to the four questions. I'll leave ownership for last, because that's where all of this is heading."
  World scene on deck/shared/world/stage.js (SCENE_BRIEF.md). Contract: starts = S09's real end dimmed
  (setState("S09-end") + setState("dim") + S09's method at scale: the 89 connections in use, the 2,773 used files and
  the 587 products beside the gf bridge, rebuilt here from s09.html with its count labels), camera full; ends = the four questions
  with evidence marks, "Who owns it?" marked last, and no S09 overlay left (S11 starts from S10's end without its
  questions).
    s0  S09's end under the dim veil, its evidence still lit (dimmed) with its counts, the headline
    s1  the four questions return at S05's anchors, in Act 3's order. For each one its region lifts out of the veil
        (a light runs round its coast), its question rises on its own plate, and S09's evidence there drains into
        the question's bar: streaks of --in-use run from the lit parcels / files / the gf bridge into the bar, the
        lights go out, the bar fills. "Who owns it?" (top right, the open sea) keeps an empty bar
    s2  "Who owns it?" marked last: circled in --key (the scene's single key moment) with "last" beside it; the Apps
        islands and their owner marks (half filled, as S06 left them) lift out of the veil; the other three recede
  S05's anchors (s05.html): used left/top (640, 798); together left = the "?" centre + 84, first line centred on
  it; rules left/top (96, 612); owns right-aligned, first baseline on the headline's. Here the questions are Bold 36
  ("ahora chicas"); "Who owns it?" moves left just enough for its pen loop to stay inside the 96 px margin.
  Colours only from THEME / theme.js variables (qa/lint_colors.py). Numbers on screen: the world's own labels and
  S09's three counts at s0 (truth.json, same meaning), which leave as their evidence drains.
-->

<script>
gsap.registerPlugin(DrawSVGPlugin);
const R = window.WorldRender, T = window.THEME, W = window.WORLD;
const NS = "http://www.w3.org/2000/svg";
const $ = (s) => document.querySelector(s);
$("#icon").src = T.icon;
const RT = W.route;

function svgEl(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }

// a polygon pushed out by d along its vertex normals (the islands are smooth blobs): the cut keeps the coast's rim
function dilate(poly, d) {
  let s = 0;
  for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length]; s += a[0] * b[1] - b[0] * a[1]; }
  const sg = s > 0 ? 1 : -1, n = poly.length;
  return poly.map((p, i) => {
    const a = poly[(i - 1 + n) % n], b = poly[(i + 1) % n];
    let nx = (b[1] - a[1]) * sg, ny = -(b[0] - a[0]) * sg;
    const L = Math.hypot(nx, ny) || 1;
    return [p[0] + (nx / L) * d, p[1] + (ny / L) * d];
  });
}
const pathD = (polys) => polys.map((p) => "M" + p.map((q) => q[0].toFixed(1) + "," + q[1].toFixed(1)).join("L") + "Z").join(" ");
// the baseline of a line box (canvas metrics of the same font), as s05.html places its "Who owns it?"
function baseOf(fs, fw, lh) {
  const c = document.createElement("canvas").getContext("2d"); c.font = `${fw} ${fs}px Vodafone`;
  const m = c.measureText("Hg"); return (lh - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2 + m.fontBoundingBoxAscent;
}

/* ------------------------------------------------------------------ S09's method at scale (as s09.html draws it) */
// screen-space canvases at camera full (world = stage px), above the veil: at s0 they show at 1 - DIM, as if under it
function ovlCanvas(parent, rect, res) {
  const cv = document.createElement("canvas");
  cv.width = Math.round(rect.w * res); cv.height = Math.round(rect.h * res);
  cv.className = "ovl";
  cv.style.cssText = `position:absolute;display:block;left:${rect.x}px;top:${rect.y}px;width:${rect.w}px;height:${rect.h}px`;
  parent.appendChild(cv);
  return cv;
}
// 89 of the 203 On-prem connections are in use (truth.json connections_onprem.used); which parcels: S09's seed
function connCanvas(parent) {
  const rect = { x: 250, y: 770, w: 590, h: 225 }, res = 2, cv = ovlCanvas(parent, rect, res), ctx = cv.getContext("2d");
  const rn = R.mulberry32(909), ids = W.conn.parcels.map((p) => p.id).filter((id) => id !== RT.db);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(rn() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  const lit = [RT.db].concat(ids.slice(0, TRUTH.connections_onprem.used - 1));
  R.parcels(ctx, rect, res, lit, { fill: T.inUse, alpha: 0.3 });
  R.bloomCells(ctx, lit.map((id) => R.parcel(id).p), T.inUse, 0.22, 12, rect, res);
  cv.__n = lit.length; cv.__pts = lit.map((id) => R.parcel(id).c);
  return cv;
}
// 587 products (truth.json apps.multi_app.products): since 2026-10-21 S09 draws no canvas for them (587 faint
// strands smudged at 720p); its count stands beside the generators -> front ends bridge. The drain streaks start
// on that bridge (the crossing at the "?", as stage.js draws it: a = gf.a, c = gf.q, b = gf.b)
function gfPoints() {
  const g = W.bridges.gf, q = (t) => [(1 - t) * (1 - t) * g.a[0] + 2 * (1 - t) * t * g.q[0] + t * t * g.b[0],
    (1 - t) * (1 - t) * g.a[1] + 2 * (1 - t) * t * g.q[1] + t * t * g.b[1]];
  return [0.08, 0.22, 0.36, 0.5, 0.64, 0.78, 0.92].map(q);
}
// 2,773 files used by apps people use (truth.json qvd_files.by_usage valid): the land's "valid" cells, lit
function filesCanvas(parent) {
  const rect = { x: 850, y: 740, w: 960, h: 260 }, res = 2, cv = ovlCanvas(parent, rect, res), ctx = cv.getContext("2d");
  const xf = (p) => [(p[0] - rect.x) * res, (p[1] - rect.y) * res];
  const cells = [];
  let files = 0;
  R.land(ctx, { xf, s: res, gap: 0, gapAlpha: 0, only: (ct) => ct.cells.some((cl) => cl.u === "valid"),
    style: (cl) => {
      if (cl.u !== "valid") return null;
      cells.push(cl.poly); files += cl.files;
      return { ground: T.rgba(T.inUse, 0.07), rgb: T.inUse, lum: 0.2, add: false, minTile: 3.4 * res, minGrain: 2.0 * res,
        gap: 0.8 * res, gapK: 0.32, dotK: 0.5, cover: 0.7, jx: 0.5, jy: 0.08 };
    } });
  R.bloomCells(ctx, cells, T.inUse, 0.2, 10, rect, res);
  cv.__n = files; cv.__pts = cells.map((p) => R.centroid(p));
  return cv;
}

(async () => {
  const h = await WorldStage.mount($("#ws"), { state: "S09-end" });
  h.setState("S09-end"); h.setState("dim");                      // the contract's start: S09's end, dimmed
  const UNDER = 1 - WorldStage.DIM;                               // what the veil leaves of a layer under it
  await Promise.all(["400 26px Vodafone", "500 26px Vodafone", "700 26px Vodafone", "700 36px Vodafone", "700 28px Vodafone",
    "400 24px Vodafone", "700 64px Vodafone"].map((f) => document.fonts.load(f)));
  await document.fonts.ready;
  const lbl = (id) => h.labels.get(id);

  // ---- the questions at S05's anchors (stage px = world units at camera full)
  const qInk = h.q.__ink, qc = [(qInk[0] + qInk[2]) / 2, (qInk[1] + qInk[3]) / 2], RING = 54;   // the "?" (answered in S09)
  const Q = {};
  for (const k of ["used", "together", "rules", "owns"]) {
    const el = $("#q-" + k), bar = el.querySelector(".qm-bar");
    Q[k] = { el, w: el.offsetWidth, h: el.offsetHeight, t: el.querySelector(".qm-t"), bar: bar.querySelector("i"), barY: bar.offsetTop + 3 };
  }
  const put = (k, x, y) => { Q[k].x = Math.round(x); Q[k].y = Math.round(y); gsap.set(Q[k].el, { x: Q[k].x, y: Q[k].y }); };
  put("used", 640, 798);                                          // between Data connections and the land
  put("together", qc[0] + RING + 30, qc[1] - 21 - 4);             // the east bank, first line centred on the crossing
  put("rules", 96, 612);                                          // Generators' south, x 96 like the headline
  // "Who owns it?": the open sea right of the headline, its first baseline on the headline's; its pen loop (s2) is
  // the outermost mark, so the loop's right edge sits on the 96 px margin (S05 put the words' edge there)
  const o = Q.owns, rx = o.w / 2 + 40, ry = o.h / 2 + 20, STROKE = 5;
  const titleBase = $("#title").offsetTop + baseOf(64, 700, 70);
  const ocx = 1824 - STROKE - 1.042 * rx;
  put("owns", ocx - o.w / 2, titleBase - baseOf(36, 700, 42));
  const barStart = (k) => [Q[k].x + 1, Q[k].y + Q[k].barY];

  // ---- the lift layer: between the veil and the labels
  const liftLayer = document.createElement("div");
  liftLayer.style.cssText = "position:absolute;inset:0;pointer-events:none";
  h.container.insertBefore(liftLayer, h.labelsEl);
  const group = () => { const g = document.createElement("div"); g.className = "lift"; liftLayer.appendChild(g); return g; };

  // a region of the map, cut from the frozen map image and frozen again: a small image, no clip or mask at play time
  const MR = h.rect, MRES = h.res;
  function crop(rect, cut) {
    const res = 2, cv = document.createElement("canvas");
    cv.width = Math.round(rect.w * res); cv.height = Math.round(rect.h * res);
    cv.style.cssText = `position:absolute;display:block;left:${rect.x}px;top:${rect.y}px;width:${rect.w}px;height:${rect.h}px`;
    const ctx = cv.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(h.map, (rect.x - MR.x) * MRES, (rect.y - MR.y) * MRES, rect.w * MRES, rect.h * MRES, 0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = "destination-in";
    ctx.setTransform(res, 0, 0, res, -rect.x * res, -rect.y * res);
    cut(ctx);
    return cv;
  }
  const rectOf = (polys, pad) => { const b = polys.map(R.bb).reduce((m, x) => [Math.min(m[0], x[0]), Math.min(m[1], x[1]), Math.max(m[2], x[2]), Math.max(m[3], x[3])]);
    const x = Math.floor(b[0] - pad), y = Math.floor(b[1] - pad); return { x, y, w: Math.ceil(b[2] + pad) - x, h: Math.ceil(b[3] + pad) - y }; };
  const fillPolys = (polys) => (ctx) => { ctx.beginPath(); for (const p of polys) { p.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.closePath(); }
    ctx.fillStyle = T.rgb(T.ink); ctx.fill(); };
  const A = W.apps, D = 4;
  const landPolys = [dilate(W.land.poly, D), dilate(W.conn.poly, D)];
  const appPolys = [dilate(A.generators.poly, D), dilate(A.frontends.poly, D)];
  // the river crossing and its product fan: a soft ellipse of light, not a cut
  const RC = [866, 600], RX = 250, RY = 165;
  const L = { used: group(), together: group(), apps: group() };
  L.used.appendChild(crop(rectOf(landPolys, 2), fillPolys(landPolys)));
  L.together.appendChild(crop({ x: RC[0] - RX, y: RC[1] - RY, w: 2 * RX, h: 2 * RY }, (ctx) => {
    ctx.translate(RC[0], RC[1]); ctx.scale(1, RY / RX);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, RX);
    g.addColorStop(0, T.rgba(T.ink, 1)); g.addColorStop(0.5, T.rgba(T.ink, 0.9)); g.addColorStop(1, T.rgba(T.ink, 0));
    ctx.fillStyle = g; ctx.fillRect(-RX, -RX, 2 * RX, 2 * RX);
  }));
  L.apps.appendChild(crop(rectOf(appPolys, 2), fillPolys(appPolys)));

  // owner marks lifted with the Apps islands: none under a question's plate (they would show through it)
  const boxes = Object.values(Q).map((q) => [q.x - 30, q.y - 22, q.x + q.w + 30, q.y + q.h + 24]);
  function ownersCopy(parent) {
    const sv = document.createElementNS(NS, "svg");
    sv.setAttribute("width", 1920); sv.setAttribute("height", 1080); sv.setAttribute("viewBox", "0 0 1920 1080");
    sv.style.cssText = "position:absolute;left:0;top:0;overflow:visible";
    const g = sv.appendChild(h.layers.owners.cloneNode(true));
    g.style.visibility = "inherit"; g.style.opacity = "1";
    for (const m of g.querySelectorAll("[data-owner]")) {
      const [px, py] = h.owners.get(m.dataset.owner).at;
      if (boxes.some((b) => px > b[0] && px < b[2] && py > b[1] && py < b[3])) m.style.display = "none";
    }
    parent.appendChild(sv);
    return sv;
  }
  ownersCopy(L.apps);

  // ---- S09's evidence (connections, files, the fan), above the veil at what the veil leaves of it
  const ovl = document.createElement("div");
  ovl.style.cssText = "position:absolute;inset:0;pointer-events:none";
  liftLayer.appendChild(ovl);
  const connCv = connCanvas(ovl), filesCv = filesCanvas(ovl), gfPts = gfPoints();
  const validFiles = TRUTH.qvd_files.by_usage.find((u) => u.key === "valid").files;
  if (connCv.__n !== TRUTH.connections_onprem.used || filesCv.__n !== validFiles)
    throw new Error("s10: S09's counts do not match truth");

  // the s2 owner marks, above everything of the map
  const ownTop = group();
  ownersCopy(ownTop);

  // freeze every canvas of the scene before the timeline
  const canv = [...liftLayer.querySelectorAll("canvas")];
  await R.freeze(canv);
  const IMG = { conn: R.fz(connCv), files: R.fz(filesCv) };

  // ---- S09's count labels (camera full: world = screen), as S09 placed them (2026-10-21: "587 products" beside
  // the gf bridge's east end and "2,773 files" on the sea above the land share one left edge)
  const GF = W.bridges.gf, CX = Math.round(GF.b[0] + 26);
  const count = (html, at, ax, ay) => { const d = document.createElement("div"); d.className = "w-label"; d.innerHTML = html; $("#counts").appendChild(d);
    gsap.set(d, { x: Math.round(at[0] - ax * d.offsetWidth), y: Math.round(at[1] - ay * d.offsetHeight) }); return d; };
  const N = {
    conn: count(`<b>Data connections</b><span class="w-dim"> · </span><span class="num">${TRUTH.connections_onprem.used}</span><span class="w-dim"> in use</span>`, lbl("connections").__L.at, 0.5, 0.5),
    lane: count(`<span class="num">${TRUTH.apps.multi_app.products}</span> products<span class="w-dim"> · generators joined to their front ends</span>`, [CX, GF.b[1]], 0, 0.5),
    files: count(`<span class="num">${validFiles.toLocaleString("en-GB")}</span> files<span class="w-dim"> used by apps people use</span>`, [CX, 724], 0, 0.5),
  };

  // ---- light: the comet round each region's coast, the crossing's bridge, and the drain streaks
  const tr = svgEl("svg", { id: "trace", width: 1920, height: 1080, viewBox: "0 0 1920 1080" }, liftLayer);
  function comet(polys) {
    const out = [];
    for (const p of polys) {
      const d = pathD([p]);
      out.push(svgEl("path", { d, fill: "none", stroke: T.rgba(T.ink, 0.12), "stroke-width": 9, "stroke-linecap": "round", "stroke-linejoin": "round" }, tr));
      out.push(svgEl("path", { d, fill: "none", stroke: T.rgba(T.ink, 0.78), "stroke-width": 2.5, "stroke-linecap": "round", "stroke-linejoin": "round" }, tr));
    }
    return out;
  }
  const TR = { used: comet(landPolys), rules: comet(appPolys) };
  {
    const gf = W.bridges.gf, d = R.bridgeD({ a: gf.a, c: gf.q, b: gf.b });
    TR.together = [
      svgEl("path", { d, fill: "none", stroke: T.rgba(T.inUse, 0.35), "stroke-width": 12, "stroke-linecap": "round" }, tr),
      svgEl("path", { d, fill: "none", stroke: T.rgba(T.app, 0.95), "stroke-width": 2.5, "stroke-linecap": "round" }, tr),
    ];
  }
  // a streak per piece of evidence: from where the light was to the start of the question's bar
  function pick(pts, n, seed, ok = () => true) {
    const rn = R.mulberry32(seed), pool = pts.filter(ok);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rn() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    return pool.slice(0, n);
  }
  function streaks(srcs, tgt, seed, bowK = 0.22) {
    const rn = R.mulberry32(seed);
    return srcs.map((s) => {
      const dx = tgt[0] - s[0], dy = tgt[1] - s[1], Lh = Math.hypot(dx, dy) || 1, bow = (rn() - 0.5) * 2 * bowK * Lh;
      const c = [(s[0] + tgt[0]) / 2 - (dy / Lh) * bow, (s[1] + tgt[1]) / 2 + (dx / Lh) * bow];
      const d = `M${s[0].toFixed(1)},${s[1].toFixed(1)} Q${c[0].toFixed(1)},${c[1].toFixed(1)} ${tgt[0].toFixed(1)},${tgt[1].toFixed(1)}`;
      return [svgEl("path", { d, fill: "none", stroke: T.rgba(T.inUse, 0.3), "stroke-width": 7, "stroke-linecap": "round" }, tr),
        svgEl("path", { d, fill: "none", stroke: T.rgba(T.inUse, 0.95), "stroke-width": 2.2, "stroke-linecap": "round" }, tr)];
    });
  }
  const ST = {
    used: streaks([...pick(connCv.__pts, 7, 31), ...pick(filesCv.__pts, 5, 37, (p) => p[0] < 1420)], barStart("used"), 41, 0.16),
    together: streaks(gfPts, barStart("together"), 43, 0.3),
    rules: streaks(pick(A.generators.parcels.map((p) => p.c), 8, 47, (p) => p[0] > 160 && p[0] < 760 && (p[1] < 590 || p[1] > 690)), barStart("rules"), 53, 0.14),
  };

  // ---- "Who owns it?" circled: a pen loop round its plate that overshoots its start, and the word "last" to its left
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  let loop = "";
  for (let i = 0; i <= 64; i++) {
    const a = (-150 + (i / 64) * 395) * Math.PI / 180, k = 1 + 0.045 * Math.sin(i / 64 * Math.PI);   // a hand's slight drift
    const px = cx + Math.cos(a) * rx * k, py = cy + Math.sin(a) * ry * k - (i / 64) * 6;
    loop += (i ? "L" : "M") + px.toFixed(1) + "," + py.toFixed(1);
  }
  const ms = $("#marksvg");
  const ring = [
    svgEl("path", { d: loop, fill: "none", stroke: T.rgba(T.key, 0.22), "stroke-width": 10, "stroke-linecap": "round", "stroke-linejoin": "round" }, ms),
    svgEl("path", { d: loop, fill: "none", stroke: T.key, "stroke-width": 3.5, "stroke-linecap": "round", "stroke-linejoin": "round" }, ms),
  ];
  const last = $("#last");
  gsap.set(last, { x: Math.round(cx - 1.023 * rx - STROKE - 18 - last.offsetWidth), y: Math.round(cy - last.offsetHeight / 2) });

  // ---- s0: S09's end, dimmed; nothing of S10's own yet
  const order = ["used", "together", "rules", "owns"];
  gsap.set([L.used, L.together, L.apps, ownTop], { autoAlpha: 0 });
  gsap.set(Object.values(IMG), { autoAlpha: UNDER });
  gsap.set([...TR.used, ...TR.rules, ...TR.together], { drawSVG: "0% 0%", autoAlpha: 1 });
  for (const k in ST) gsap.set(ST[k].flat(), { drawSVG: "0% 0%", autoAlpha: 1 });
  gsap.set(order.map((k) => Q[k].el), { autoAlpha: 0 });
  gsap.set(order.map((k) => Q[k].t), { y: 16 });
  gsap.set(order.map((k) => Q[k].bar), { scaleX: 0 });
  gsap.set(ring, { drawSVG: "0% 0%" });
  gsap.set([last, "#legend"], { autoAlpha: 0 });
  gsap.set(lbl("connections"), { autoAlpha: 0 });                 // S09 shows its count in its place
  const names = [...h.labels.values()].filter((el) => el !== h.q && el !== lbl("connections"));

  const tl = gsap.timeline({ paused: true });
  tl.addLabel("s0", 0);
  const NAMES = 0.55;
  tl.to(names, { autoAlpha: NAMES, duration: 0.6, ease: R.MOTION.light }, "s0");

  // one question: its region out of the veil, the light round it, the question rises, the evidence drains into it
  const T0 = { used: 0.15, together: 1.3, rules: 2.45, owns: 3.6 };
  const lift = (g, t0, out, outDur = 0.7) => { tl.to(g, { autoAlpha: 1, duration: 0.5, ease: R.MOTION.light }, t0); tl.to(g, { autoAlpha: 0, duration: outDur, ease: R.MOTION.light }, out); };
  const run = (paths, t0, dur) => {
    tl.to(paths, { drawSVG: "0% 100%", duration: dur, ease: "power1.inOut" }, t0);
    tl.to(paths, { drawSVG: "100% 100%", duration: dur, ease: "power1.inOut" }, t0 + dur * 0.32);
    tl.to(paths, { autoAlpha: 0, duration: 0.15, ease: "none" }, t0 + dur * 1.32 - 0.15);   // no cap dot left behind
  };
  const rise = (k, t0) => { tl.to(Q[k].el, { autoAlpha: 1, duration: 0.45, ease: R.MOTION.mark }, t0); tl.to(Q[k].t, { y: 0, duration: 0.7, ease: R.MOTION.rise }, t0); };
  const drain = (k, t0) => {
    ST[k].forEach((pair, i) => {
      const t = t0 + i * 0.035;
      tl.to(pair, { drawSVG: "0% 100%", duration: 0.5, ease: "power2.in" }, t);
      tl.to(pair, { drawSVG: "100% 100%", duration: 0.3, ease: "power2.in" }, t + 0.35);
      tl.to(pair, { autoAlpha: 0, duration: 0.1, ease: "none" }, t + 0.55);
    });
    tl.to(Q[k].bar, { scaleX: 1, duration: 0.75, ease: "power2.inOut" }, t0 + 0.45);
  };

  // Is it still used?  Data connections and the land: 89 connections, 2,773 files
  let t0 = T0.used;
  lift(L.used, t0, t0 + 1.4);
  tl.to([IMG.conn, IMG.files], { autoAlpha: 1, duration: 0.5, ease: R.MOTION.light }, t0);
  run(TR.used, t0, 1.15);
  rise("used", t0 + 0.2);
  drain("used", t0 + 0.5);
  tl.to([N.conn, N.files], { autoAlpha: 0, duration: 0.4, ease: R.MOTION.light }, t0 + 0.6);
  tl.to(lbl("connections"), { autoAlpha: NAMES, duration: 0.5, ease: R.MOTION.light }, t0 + 0.8);
  tl.to([IMG.conn, IMG.files], { autoAlpha: 0, duration: 0.75, ease: R.MOTION.light }, t0 + 0.75);
  tl.to("#legend", { autoAlpha: 1, duration: 0.6, ease: R.MOTION.light }, t0 + 1.0);

  // What belongs together?  the river crossing (S09's 587 products stand beside it)
  t0 = T0.together;
  lift(L.together, t0, t0 + 1.4);
  run(TR.together, t0 + 0.05, 0.9);
  rise("together", t0 + 0.2);
  drain("together", t0 + 0.5);
  tl.to(N.lane, { autoAlpha: 0, duration: 0.3, ease: R.MOTION.light }, t0);   // its place is the question's (rises at t0 + 0.2)

  // Does it follow the rules?  the Apps islands (each app's log declares what it holds); gone before "Who owns it?"
  t0 = T0.rules;
  lift(L.apps, t0, t0 + 1.05, 0.6);
  run(TR.rules, t0, 1.15);
  rise("rules", t0 + 0.2);
  drain("rules", t0 + 0.5);

  // Who owns it?  the open sea, top right: no evidence in the logs, the bar stays empty
  rise("owns", T0.owns + 0.2);
  tl.addLabel("s1", T0.owns + 1.0);

  // ---- s1 -> s2: ownership, last
  const faint = getComputedStyle(document.documentElement).getPropertyValue("--ink-faint").trim();
  tl.to([Q.used.t, Q.together.t, Q.rules.t], { color: faint, duration: 0.6, ease: R.MOTION.light }, "s1");
  tl.to([Q.used, Q.together, Q.rules].map((q) => q.el.querySelector(".qm-bar")), { autoAlpha: 0.55, duration: 0.6, ease: R.MOTION.light }, "s1");
  tl.to(L.apps, { autoAlpha: 0.45, duration: 0.7, ease: R.MOTION.light }, "s1");
  tl.to(ownTop, { autoAlpha: 1, duration: 0.7, ease: R.MOTION.light }, "s1+=0.1");
  tl.to(ring, { drawSVG: "0% 100%", duration: 0.85, ease: "power2.inOut" }, "s1+=0.35");
  tl.to(last, { autoAlpha: 1, duration: 0.5, ease: R.MOTION.mark }, "s1+=1.0");
  tl.addLabel("s2", "s1+=1.5");                                  // = the timeline's end (?at=end lands here)

  window.__s10 = { h, Q, qc, N, ring: { cx, cy, rx, ry } };
  await $("#icon").decode().catch(() => {});
  Scene.init(tl, ["s0", "s1", "s2"]);
})();
</script>
</body>
