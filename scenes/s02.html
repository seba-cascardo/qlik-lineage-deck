<title>S02 · Qlik in 90 seconds</title>
<!--
  S02 "Qlik in 90 seconds" (storyboard v4 S02; world spec docs/superpowers/specs/2026-10-20-world-cadastre-design.md
  §4). Rebuilt on the night stage on 2026-10-21 (Seba: "por qué en blanco y con ese low res? ... respetando la
  estética y los assets de las otras"); the paper version is in qa/out/backup_intro/s02.paper.html.
  Every piece of the primer is a fragment of the REAL city of deck/shared/world (WORLD), drawn by WorldRender (R.map:
  its cadastre, textures, contour rings, bloom), cut out along its own streets with a soft fade, so the audience meets
  the same glyphs two scenes later on S04's map:
    an app        = a parcel of the Apps islands (lit = THEME.app's light)
    a stream      = a fenced district of an Apps island ("a folder of the hub"): gs6 on Generators, fs26 on Front ends
    a source      = a parcel of the Data connections island (district 6), with a database drum
    a container   = a plot of the containers land (SalesContainer, W.sales_container) with its file tiles; the QVD
                    file = one tile, at W.sales_file
    a relationship = a bridge of light in --in-use (R.lightBridge, as S09 draws the logs' links)
    users          = lights (R.lights) in the sea beyond the Front ends' coast
  The only paper is the app card (s0-s1), a sheet like S08/S09's diaries.
    s0  a dashboard, on a paper card
    s1  app = dashboard + script; the reload runs the script (a band down each line) and the dashboard refreshes
    s2  the camera pulls back from the card until it is one lit parcel of the fenced stream "Finance" on the Front
        ends island (the map is drawn at three resolutions so it stays sharp at every scale of the dolly)
    s3  the camera opens west: the short path, a source -> the front end -> users
    s4  the long path: source -> generator (its own stream) -> QVD file in its container -> front end -> users
    s5  the "Product" bracket
  Which parcels, districts and file are shown is illustrative (fixed ids of the seeded data.js); no numbers on screen.
  Colours only from THEME / theme.js's CSS variables (qa/lint_colors.py). Red only in the icon.
-->

  /* ---------------------------------------------------------------- the key (a map legend that grows with each idea) */
  #keyRule { position: absolute; left: 96px; top: 934px; width: 1728px; height: 2px; transform-origin: 0 50%;
    background: color-mix(in srgb, var(--ink-faint) 35%, transparent); }
  #key { position: absolute; left: 96px; top: 957px; width: 1640px; height: 84px; }
  .k { position: absolute; display: flex; align-items: center; gap: 14px; white-space: nowrap; font-size: 24px; line-height: 30px; }

<body class="scene">
<div id="stage">

  </div>
  <div id="cardWrap">
    <svg id="cardBg" width="960" height="620" viewBox="0 0 960 620"><polygon id="cardPoly"/></svg>
    <div id="cardContent">
      <div class="c-head"><span class="t">Sales overview</span><span class="m">Qlik app</span></div>
      <div class="c-rule"></div>
      <div class="pane-h" id="hDash" style="left:28px">Dashboard</div>

      <div id="reload"><svg viewBox="-17 -17 34 34"><g id="rlg"><path class="rl-arc" d="M11.3 -8.5A14 14 0 1 0 13.8 2.4"/><path class="rl-head" d="M6.2 -12.4L15.6 -13.2L13.2 -4Z"/></g></svg>Reload</div>

    </div>
  </div>
  <div class="lb cap" id="appdef" style="left:480px;top:178px"><b>App</b> = a dashboard + the script that loads its data</div>
  <h1 class="scene-title">Qlik in 90 seconds</h1>

<script src="../shared/vendor/gsap.min.js"></script>
<script src="../shared/vendor/DrawSVGPlugin.min.js"></script>
<script src="../shared/scene-runtime.js"></script>
<script src="../shared/world/world.js"></script>
<script>
gsap.registerPlugin(DrawSVGPlugin);
const R = window.WorldRender, T = window.THEME, W = window.WORLD, M = R.MOTION;
const NS = "http://www.w3.org/2000/svg";
const $ = (s) => document.querySelector(s);
$("#icon").src = T.icon;

function svgEl(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function div(cls, parent, html) { const d = document.createElement("div"); if (cls) d.className = cls; if (html !== undefined) d.innerHTML = html; if (parent) parent.appendChild(d); return d; }
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const f1 = (v) => v.toFixed(1);
const dOf = (pts, close = true) => "M" + pts.map((p) => f1(p[0]) + "," + f1(p[1])).join(" L") + (close ? " Z" : "");
const bbOf = (polys) => { let b = [1e9, 1e9, -1e9, -1e9]; for (const p of polys) { const q = R.bb(p); b = [Math.min(b[0], q[0]), Math.min(b[1], q[1]), Math.max(b[2], q[2]), Math.max(b[3], q[3])]; } return b; };
function canvas(w, h) { const c = document.createElement("canvas"); c.width = Math.round(w); c.height = Math.round(h); return c; }

// ------------------------------------------------------------------ the real places (fixed ids of the seeded world)
const parcelOf = (id) => { const p = R.parcel(id); if (!p) throw new Error(`s02: parcel ${id} is missing from WORLD`); return p; };
const DB1 = parcelOf("c107"), DB2 = parcelOf("c116");          // two connections, Data connections' district 6
const GEN = parcelOf("g332");                                  // a generator in stream gs6
const FE1 = parcelOf("f1644"), FE2 = parcelOf("f1569");        // two front ends in stream fs26 ("Finance")
const D_GEN = R.district("gs6"), D_FE = R.district("fs26");
const D_CONN = W.conn.districts[6];
const CT = W.land.containers.find((c) => c.id === W.sales_container);
const FILE = W.sales_file;
if (!D_GEN || !D_FE || !D_CONN || !CT || !FILE) throw new Error("s02: a district, the sales container or the sales file is missing from WORLD");
for (const [p, d] of [[GEN, D_GEN], [FE1, D_FE], [FE2, D_FE]]) if (!R.inside(p.c, d.poly)) throw new Error(`s02: ${p.id} is not inside ${d.id}`);
for (const p of [DB1, DB2]) if (!R.inside(p.c, D_CONN)) throw new Error(`s02: ${p.id} is not inside connection district 6`);
if (!R.inside(FILE, CT.poly)) throw new Error("s02: the sales file is not inside its container");

// ------------------------------------------------------------------ the diagram: four fragments on two lanes
// Each fragment shows its part of the city at zoom Z (stage px per world unit); its anchor sits on the top lane LT.
const Z = 2.4, LT = 440;
// core: what the fragment is about; focus: the rest of the fragment steps back (S16's spotlight); own: the fragment
// is an Apps island and keeps its own light (R.map's Apps bloom); elsewhere that bloom would be light spilled from
// islands the fragment does not show
const POOL = {
  dc:  { core: [W.conn.districts[0], W.conn.districts[1], D_CONN], anchor: DB1.c, at: [479, LT], focus: false, own: false },
  gen: { core: [D_GEN.poly], anchor: GEN.c, at: [828, LT], focus: true, own: true },
  ct:  { core: [CT.poly], anchor: FILE, at: [1056, LT], focus: true, own: false },
  fe:  { core: [D_FE.poly], anchor: FE1.c, at: [1409, LT], focus: true, own: true },
};
// a fragment ends a little past its core, along its own streets: the core dilated by DIL, blurred by SIG (world
// units); outside the core the city steps back under a veil of the stage (DIMV)
const DIL = 12, SIG = 2.2, PADW = DIL + 3 * SIG + 2, DIMV = 0.5;
for (const P of Object.values(POOL)) {
  P.S = (p) => [P.at[0] + Z * (p[0] - P.anchor[0]), P.at[1] + Z * (p[1] - P.anchor[1])];
  const b = bbOf(P.core);
  const x = Math.floor(b[0] - PADW), y = Math.floor(b[1] - PADW);
  P.rect = { x, y, w: Math.ceil(b[2] + PADW) - x, h: Math.ceil(b[3] + PADW) - y };
  P.box = bbOf(P.core.map((poly) => poly.map(P.S)));         // the core on screen (rest)
}
const sPoly = (P, poly) => poly.map(P.S);
const sBB = (P, poly) => R.bb(sPoly(P, poly));
const sCentre = (P, poly) => { const b = sBB(P, poly); return [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2]; };

// the fragment's soft edge: a low-res mask (2 px per world unit), dithered
function maskFor(P, seed) {
  const k = 2, rect = P.rect, a = canvas(rect.w * k, rect.h * k), g = a.getContext("2d");
  g.setTransform(k, 0, 0, k, -rect.x * k, -rect.y * k);
  g.fillStyle = T.rgb(T.ink); g.strokeStyle = T.rgb(T.ink); g.lineJoin = "round"; g.lineWidth = 2 * DIL;
  for (const poly of P.core) { R.path(g, poly); g.fill(); g.stroke(); }
  const b = canvas(a.width, a.height), bg = b.getContext("2d");
  bg.filter = `blur(${SIG * k}px)`; bg.drawImage(a, 0, 0); bg.filter = "none";
  const id = bg.getImageData(0, 0, b.width, b.height), d = id.data, rnd = R.mulberry32(seed);
  for (let i = 0; i < d.length; i += 4) { const a = d[i + 3]; if (a > 0 && a < 255) d[i + 3] = clamp(a + (rnd() - 0.5) * 2, 0, 255); }
  bg.putImageData(id, 0, 0);
  return b;
}
// the city itself (R.map) over a world rectangle at res canvas px per world unit, cut by the fragment's mask
function mapCanvas(P, rect, res, mask) {
  const c = canvas(rect.w * res, rect.h * res), ctx = c.getContext("2d");
  R.map(ctx, rect, res, P.own ? { detached: "lit" } : { detached: "lit", bloom: 0 });
  if (P.focus) {
    // the spotlight: everything outside the core under a veil of the stage (the core's edge is a street)
    ctx.save(); ctx.setTransform(res, 0, 0, res, -rect.x * res, -rect.y * res);
    ctx.beginPath(); ctx.rect(rect.x - 1, rect.y - 1, rect.w + 2, rect.h + 2);
    for (const poly of P.core) for (let i = poly.length - 1; i >= 0; i--) { if (i === poly.length - 1) ctx.moveTo(poly[i][0], poly[i][1]); else ctx.lineTo(poly[i][0], poly[i][1]); }
    ctx.closePath(); ctx.fillStyle = T.rgba(T.stage, DIMV); ctx.fill("evenodd"); ctx.restore();
  }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "destination-in"; ctx.imageSmoothingQuality = "high";
  const k = 2;   // the mask's own px per world unit, over P.rect
  ctx.drawImage(mask, (rect.x - P.rect.x) * k, (rect.y - P.rect.y) * k, rect.w * k, rect.h * k, 0, 0, c.width, c.height);
  ctx.restore();
  const [sx, sy] = P.S([rect.x, rect.y]);
  c.style.cssText = `left:${f1(sx)}px;top:${f1(sy)}px;width:${f1(rect.w * Z)}px;height:${f1(rect.h * Z)}px`;
  $("#pools").appendChild(c);
  return c;
}
// a lit element (parcels in THEME.app's light, their bloom, and an optional mark drawn in world units)
function litCanvas(P, polys, res, opt = {}) {
  const b = bbOf(polys), pad = 22, x = Math.floor(b[0] - pad), y = Math.floor(b[1] - pad);
  const rect = { x, y, w: Math.ceil(b[2] + pad) - x, h: Math.ceil(b[3] + pad) - y };
  const c = canvas(rect.w * res, rect.h * res), ctx = c.getContext("2d");
  R.bloomCells(ctx, polys, T.app, opt.bloom ?? 0.7, opt.blur ?? 7, rect, res, opt.seed ?? 5);
  R.parcels(ctx, rect, res, polys.map((p) => ({ p })), { fill: T.app, alpha: 1 });
  if (opt.mark) { ctx.save(); ctx.setTransform(res, 0, 0, res, -rect.x * res, -rect.y * res); opt.mark(ctx); ctx.restore(); }
  const [sx, sy] = P.S([rect.x, rect.y]);
  c.style.cssText = `left:${f1(sx)}px;top:${f1(sy)}px;width:${f1(rect.w * Z)}px;height:${f1(rect.h * Z)}px`;
  $("#lits").appendChild(c);
  return c;
}
// a database drum inside a lit connection parcel (world units), in the stage's colour
function drum(c) {
  return (g) => {
    const rx = 4.6, ry = 1.7, top = c[1] - 3.6, bot = c[1] + 3.6;
    g.strokeStyle = T.rgb(T.stage); g.lineWidth = 0.95; g.lineCap = "round";
    g.beginPath(); g.ellipse(c[0], top, rx, ry, 0, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.moveTo(c[0] - rx, top); g.lineTo(c[0] - rx, bot); g.ellipse(c[0], bot, rx, ry, 0, Math.PI, 0, true); g.lineTo(c[0] + rx, top); g.stroke();
    g.beginPath(); g.ellipse(c[0], c[1], rx, ry, 0, Math.PI, 0, true); g.stroke();
  };
}

// ------------------------------------------------------------------ the camera of s2: a pull-back from the card
// The card (s0-s1) is FE2's parcel seen at K times the rest zoom; s2 is one dolly from K to 1 about a fixed screen
// point F, ending with the Front ends fragment centred (CAMX); s3 opens the camera west (CAMX -> 0).
const PF = POOL.fe;
const fe2R = sCentre(PF, FE2.p), fe2B = sBB(PF, FE2.p);
const CARD = { x: 480, y: 250, w: 960, h: 620 }, BC = [CARD.x + CARD.w / 2, CARD.y + CARD.h / 2];
const K = Math.min(CARD.w / (fe2B[2] - fe2B[0]), CARD.h / (fe2B[3] - fe2B[1]));
const CAMX = Math.round(960 - (PF.box[0] + PF.box[2]) / 2);
const Pr2 = [fe2R[0] + CAMX, fe2R[1]];
const Fx = [(K * Pr2[0] - BC[0]) / (K - 1), (K * Pr2[1] - BC[1]) / (K - 1)];
const dollyE = gsap.parseEase(M.dolly);
const camAt = (p) => { const e = dollyE(p), s = Math.pow(K, 1 - e); return { s, P: [Fx[0] + (BC[0] - Fx[0]) * s / K, Fx[1] + (BC[1] - Fx[1]) * s / K] }; };
// the map of the Front ends fragment at three resolutions: base (rest, sharp to s 2), H2 (sharp to s 4.2) and H1
// (s 3.8-6, over the part of the fragment the camera sees then); the map fades in from s 6
const RES = { base: 2 * Z, h2: 10, h1: 15 };
function visibleRect(s0, s1) {
  let b = [1e9, 1e9, -1e9, -1e9];
  for (let i = 0; i <= 40; i++) {
    const s = s0 + (s1 - s0) * i / 40, e = 1 - Math.log(s) / Math.log(K), p = e;   // P depends on s only
    const P = [Fx[0] + (BC[0] - Fx[0]) * s / K, Fx[1] + (BC[1] - Fx[1]) * s / K];
    for (const X of [[0, 0], [1920, 1080]]) {
      const q = [fe2R[0] + (X[0] - P[0]) / s, fe2R[1] + (X[1] - P[1]) / s];
      const w = [PF.anchor[0] + (q[0] - PF.at[0]) / Z, PF.anchor[1] + (q[1] - PF.at[1]) / Z];
      b = [Math.min(b[0], w[0]), Math.min(b[1], w[1]), Math.max(b[2], w[0]), Math.max(b[3], w[1])];
    }
    void p;
  }
  const r = PF.rect, x0 = Math.max(r.x, Math.floor(b[0]) - 4), y0 = Math.max(r.y, Math.floor(b[1]) - 4);
  const x1 = Math.min(r.x + r.w, Math.ceil(b[2]) + 4), y1 = Math.min(r.y + r.h, Math.ceil(b[3]) + 4);
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

// ------------------------------------------------------------------ the dashboard and the script of the card
function buildCard() {
  const DW = 400, DH = 452;
  const sv = svgEl("svg", { width: DW, height: DH, viewBox: `0 0 ${DW} ${DH}` }, $("#dash"));
  svgEl("rect", { class: "d-frame", x: 1, y: 1, width: DW - 2, height: DH - 2, rx: 8 }, sv);
  svgEl("text", { class: "d-ttl", x: 22, y: 42 }, sv).textContent = "Sales by month";
  const rd = R.mulberry32(7), bx = 24, bw = DW - 48, by0 = 72, by1 = 258;
  svgEl("path", { class: "d-axis", d: `M${bx} ${by1}H${bx + bw}` }, sv);
  const NB = 8, gap = 10, bW = (bw - gap * (NB - 1)) / NB, bars = [];
  for (let i = 0; i < NB; i++) {
    const h0 = (0.25 + 0.6 * rd()) * (by1 - by0), h1 = (0.3 + 0.65 * rd()) * (by1 - by0), x = bx + i * (bW + gap);
    const rect = svgEl("rect", { class: "d-bar" + (i % 3 === 2 ? " alt" : ""), x: f1(x), y: f1(by1 - h0), width: f1(bW), height: f1(h0), rx: 2 }, sv);

    tl.to(r.band, { autoAlpha: 0, duration: 0.5, ease: M.light }, t + 0.8 + i * 0.26);
  });
  t = 3.1;
  card.bars.forEach((b, i) => {
    tl.to(b.fresh, { autoAlpha: 1, duration: 0.25, ease: "none" }, t + i * 0.05);
    tl.to(b.rect, { attr: { y: f1(b.y1 - b.h1), height: f1(b.h1) }, duration: 0.6, ease: M.lift }, t + i * 0.05);
    tl.to(b.fresh, { autoAlpha: 0, duration: 0.5, ease: M.light }, t + 0.5 + i * 0.05);
  });
  tl.to(card.line0, { autoAlpha: 0, duration: 0.4, ease: M.light }, t);
  tl.to(card.line1, { drawSVG: "100%", duration: 0.8, ease: M.beam }, t + 0.1);
  tl.to(card.area0, { autoAlpha: 0, duration: 0.5, ease: M.light }, t);
  tl.to(card.area1, { autoAlpha: 1, duration: 0.6, ease: M.light }, t + 0.3);
  tl.addLabel("s1", tl.duration() + 0.15);

  // s2 · the camera pulls back: the card becomes one lit parcel of the fenced stream "Finance"
  t = tl.labels.s1 + 0.05;
  tl.to($("#appdef"), { autoAlpha: 0, duration: 0.35, ease: M.light }, t);
  const Z0 = t + 0.15, ZD = 2.4, proxy = { p: 0 };
  tl.to(proxy, { p: 1, duration: ZD, ease: "none", onUpdate: () => apply(proxy.p) }, Z0);
  draw(fenceFe, Z0 + ZD - 0.75, 1.0);
  rise(L.feTab, Z0 + ZD - 0.3);
  kindle(iUBot, Z0 + ZD - 0.2);
  rise(L.uBot, Z0 + ZD);
  tl.to($("#keyRule"), { scaleX: 1, duration: 0.9, ease: M.slide }, Z0 + ZD - 0.5);
  rise([kApp, kReload], Z0 + ZD - 0.4, 0.12);
  rise(kStream, Z0 + ZD + 0.1);
  tl.addLabel("s2", tl.duration() + 0.15);

  // s3 · the camera opens west; the short path: a source -> the front end -> users
  t = tl.labels.s2 + 0.05;
  tl.fromTo(cam, { x: CAMX }, { x: 0, duration: 1.4, ease: M.dolly, immediateRender: false }, t);
  fadeIn(iDC, t + 0.6);
  rise([L.sources, L.sourcesSub], t + 0.9, 0.1);
  kindle(iDB2, t + 1.35);
  beam(brShort, t + 1.55, 1.1);
  rise(L.short, t + 1.9);
  rise(L.fe2, t + 2.3);
  beam(brShortU, t + 2.45, 0.55);
  tl.addLabel("s3", tl.duration() + 0.15);

  // s4 · the long path: source -> generator (own stream) -> QVD file in its container -> front end -> users
  t = tl.labels.s3 + 0.05;
  fadeIn(iGEN, t);
  draw(fenceGen, t + 0.4, 0.8);
  rise(L.genTab, t + 0.7);
  kindle(iGENl, t + 0.8);
  rise(L.gen, t + 0.95);
  fadeIn(iCT, t + 0.45);
  draw(plotCt, t + 0.9, 0.7);
  rise([L.cont, L.contSub], t + 1.1, 0.1);
  rise(kCont, t + 1.3);
  kindle(iDB1, t + 1.2);
  kindle(iFE1l, t + 1.3);
  beam(brSrcGen, t + 1.5, 0.7);
  beam(brGenQvd, t + 2.15, 0.8);
  kindle(iQVD, t + 2.8);
  rise(L.qvd, t + 2.9);
  rise(kQvd, t + 3.0);
  beam(brQvdFe, t + 3.0, 0.8);
  rise(L.fe1, t + 3.6);
  kindle(iUTop, t + 3.7);
  beam(brFeU, t + 3.75, 0.55);
  rise(L.uTop, t + 4.0);
  tl.addLabel("s4", tl.duration() + 0.15);

  // s5 · generator + its QVD files + front end = one product
  t = tl.labels.s4 + 0.05;
  beam(brkL, t, 0.9);
  beam(brkR, t, 0.9);
  rise(L.prod, t + 0.5);
  rise(L.prodSub, t + 0.7);
  tl.addLabel("s5", tl.duration() + 0.15);
  tl.set({}, {}, tl.labels.s5);   // the timeline ends on its last label

  await Promise.all(["400", "500", "700"].map((w) => document.fonts.load(`${w} 26px Vodafone`)));
  await document.fonts.ready;
  await $("#icon").decode().catch(() => {});
  Scene.init(tl, ["s0", "s1", "s2", "s3", "s4", "s5"]);
})();
</script>
</body>
</html>
