<!--
  S09 One clue became a method (Task 6 of docs/plans/2026-10-20-night-map-deck.md; storyboard v4 S09; the world of
  docs/superpowers/specs/2026-10-20-world-cadastre-design.md, through deck/shared/world/SCENE_BRIEF.md).
    s0  = S08's end: camera diary, the world dim (S06-end + dim), labelled; ONE wide log sheet on the left (the
        generator's diary) with LIB CONNECT lensed in red, "connected to a database" and "the clue we just found";
        S08's lit list (its 89 connections in use, drawn as s08.html draws them, above the veil) and its count block
        "Data connections / 89 of 203 in use" under the island, in place of the island's own name (QA 2026-10-21:
        the cut dropped both and s5 lit the 89 again as if new)
    s1  STORE · "saved a file"; the clue cools from red to the colour of a relationship (--in-use); the sheets' ground
        (the left veil) comes up
    s2  the front end's diary (a second sheet, same width) slides in under it; LOAD · "read a file"
    s3  LET in both diaries · "declared: holds PII data"
    s4  continuous (about 8.5 s): S08's list and its count fade as the camera opens the map beside the sheets (camera
        ROUTE), the names leave the
        lines (their glyphs dim as they lift) and the traced route is drawn: generator -> SALES_DB, generator ->
        sales_orders.qvd inside SalesContainer ("one file", "a project folder"), that file -> the front end; the
        file name is underlined red in both diaries, two red rules run on under each line and converge on the file,
        MATCH (Living Typography, the talk's one) slams, holds about 1.2 s and collapses onto the file; the
        generator -> front end bridge crosses the river over the "?", which goes
    s5  continuous (about 4.3 s): the sheets and their ground are put away, the traced route fades, the camera goes
        to full (the Auditor islands keep their names through the move); S06's dashed links come back and turn
        solid one by one, each lighting what it found: Data connections (S08's 89 in use back, as the recap), the land (the second port
        built, 2,773 used files lit), and last the "?" crossing ("587 products", beside that bridge). The world
        rests in exactly WorldStage "S09-end" (bridged in, needed and the "?" out, owners half) under the counts;
        the footnote on log retention in its own bottom band
  Colours only from THEME / the CSS variables of deck/shared/world/theme.js (qa/lint_colors.py).
-->

<script src="../shared/vendor/gsap.min.js"></script>
<script src="../shared/vendor/DrawSVGPlugin.min.js"></script>

<script>
gsap.registerPlugin(DrawSVGPlugin);
const R = window.WorldRender, T = window.THEME, W = window.WORLD, E = R.MOTION;
const $ = (s, el = document) => el.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
$("#icon").src = T.icon;

/* ------------------------------------------------------------------ colours, all from tokens (runtime strings) */
const mixC = (a, b, k) => { const A = T.channels(a), B = T.channels(b); return A.map((v, i) => Math.round(v * k + B[i] * (1 - k))); };
const COL = {
  red: T.rgb(T.key), redTint: T.rgba(T.key, 0.13),
  // the colour of a relationship, written on paper: --in-use stepped toward the paper's ink so it reads at 24 px
  use: T.rgb(mixC(T.inUse, T.paperInk, 0.62)), useTint: T.rgba(T.inUse, 0.2), useLine: T.rgb(T.inUse),
  grey: T.rgb(T.paperInkDim), greyTint: T.rgba(T.paperInk, 0.08),
  ink: T.rgb(T.paperInk),
};

/* ------------------------------------------------------------------ the camera that opens the map beside the sheets */
// screen = (x, y) + scale * world. The traced route sits in x 1000-1800, the sheets keep x 96-936 (separate zones);
// the land's bottom and its sea rings end above y 930, so nothing passes under the icon (the world's icon air holds
// at camera full only)
const ROUTE = { x: 306, y: -218, scale: 1.1 };
const scr = (p, c = ROUTE) => [c.x + c.scale * p[0], c.y + c.scale * p[1]];
const RT = W.route, BR = Object.fromEntries(RT.bridges.map((b) => [b.id, b]));
const SC = W.land.containers.find((c) => c.id === W.sales_container);

/* ------------------------------------------------------------------ the two diaries (foundation/reload-log-*.txt) */
const NOTES = {
  db: { text: "connected to a database", aside: "the clue we just found" },
  store: { text: "saved a file" },
  load: { text: "read a file" },
  let: { text: "declared: holds PII data" },
};
const SHEETS = {
  gen: { title: "Generator app", kind: "", meta: "reload log · 12 Oct 2026 · 06:00", rows: [
    { hd: true, tx: "Execution started." },
    { no: "0013", key: "let", tx: "<b>LET</b> vPII = 'Yes'" },
    { no: "0021", tx: "// ---- Extract: sales orders ----" },
    { no: "0022", key: "db", tx: "<b>LIB CONNECT TO</b> '<span class=\"nm\" data-n=\"db\">SALES_DB<i></i></span>'" },
    { no: "0024", tx: "<b>SQL SELECT</b> * FROM dbo.SalesOrders" },
    { no: "0026", key: "store", tx: "<b>STORE</b> SalesOrders INTO [lib://<span class=\"nm\" data-n=\"cont\">SalesContainer<i></i></span>/QVD/<span class=\"nm\" data-n=\"file\">sales_orders.qvd<i></i></span>] (qvd)" },
    { no: "0027", tx: "<b>DROP TABLE</b> SalesOrders" },
    { no: "0041", tx: "<b>DISCONNECT</b>" },
  ] },
  fe: { title: "Sales YoY", kind: "front end", meta: "reload log · 12 Oct 2026 · 07:02", rows: [
    { hd: true, tx: "Execution started." },
    { no: "0011", key: "let", tx: "<b>LET</b> vPII = 'Yes'" },
    { no: "0018", tx: "// ---- Data model ----" },
    { no: "0020", key: "load", tx: "<b>LOAD</b> * FROM [lib://SalesContainer/QVD/<span class=\"nm\" data-n=\"file\">sales_orders.qvd<i></i></span>] (qvd)" },
    { no: "0024", tx: "<b>LOAD</b> * FROM [lib://SalesContainer/QVD/customers.qvd] (qvd)" },
    { no: "0028", tx: "<b>LOAD</b> * FROM [lib://MasterContainer/QVD/calendar.qvd] (qvd)" },
  ] },
};
const TOP = 160, GAP = 24, HEAD = 70, TEX = 28, KEY = 36, NOTE = 36, PADB = 14;

function buildSheet(id) {
  const def = SHEETS[id];
  const el = document.createElement("div"); el.className = "sheet"; el.id = "sheet-" + id;
  const paper = document.createElement("div"); paper.className = "paper"; el.appendChild(paper);
  el.insertAdjacentHTML("beforeend", `<div class="shead"><span class="t"><span class="ttl">${def.title}</span>${def.kind ? `<span>${def.kind}</span>` : ""}</span><span class="m">${def.meta}</span></div><div class="srule"></div>`);
  const S = { id, el, paper, rows: [], title: $(".ttl", el) };
  for (const r of def.rows) {
    const row = document.createElement("div");
    row.className = "row" + (r.hd ? " hd" : "") + (r.key ? " key" : "");
    if (r.key) row.insertAdjacentHTML("beforeend", `<div class="band"></div>`);
    row.insertAdjacentHTML("beforeend", `<span class="no">${r.no || ""}</span><span class="tx">${r.tx}</span>`);
    const item = { el: row, key: r.key || null, h: r.key ? KEY : TEX, tx: $(".tx", row), no: $(".no", row) };
    if (r.key) {
      const n = NOTES[r.key];
      row.insertAdjacentHTML("beforeend", `<div class="note"><span class="nt">${n.text}</span>${n.aside ? `<span class="aside">${n.aside}</span>` : ""}</div>`);
      item.band = $(".band", row); item.note = $(".note", row); item.aside = $(".aside", row);
      item.names = Object.fromEntries([...row.querySelectorAll(".nm")].map((e) => [e.dataset.n, e]));
    }
    el.appendChild(row);
    S.rows.push(item);
  }
  $("#sheets").appendChild(el);
  return S;
}
function layout(S, open) {
  let y = HEAD; const ys = [];
  for (const r of S.rows) { ys.push(y); y += r.h + (r.key && open.includes(r.key) ? NOTE : 0); }
  return { ys, h: y + PADB };
}
const rowOf = (S, key) => S.rows.find((r) => r.key === key);

// the paper: a soft dithered light from above (canvas, frozen), never a CSS gradient
function paperCanvas(w, h, seed) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"), id = g.createImageData(w, h), d = id.data, rn = R.mulberry32(seed);
  const [pr, pg, pb] = T.channels(T.paper);
  for (let y = 0; y < h; y++) {
    const fy = y / h, dk = 9 * fy * fy;
    for (let x = 0; x < w; x++) {
      const fx = Math.abs(x - w / 2) / (w / 2), n = (rn() - 0.5) * 2, k = (y * w + x) * 4, s = dk + 4 * fx * fx;
      d[k] = pr - s + n; d[k + 1] = pg - s + n; d[k + 2] = pb - s + n; d[k + 3] = 255;
    }
  }
  g.putImageData(id, 0, 0);
  return c;
}

// the sheets' own ground at the route camera: the stage, nearly opaque under title and sheets, gone by x 1010
function leftVeil() {
  const c = $("#lveil"), w = c.width, h = c.height, g = c.getContext("2d"), id = g.createImageData(w, h), d = id.data;
  const [sr, sg, sb] = T.channels(T.stage), rn = R.mulberry32(91), x0 = 820 / 4, x1 = 1010 / 4;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const u = Math.max(0, Math.min(1, (x - x0) / (x1 - x0))), s = 1 - u * u * (3 - 2 * u), k = (y * w + x) * 4;
    d[k] = sr; d[k + 1] = sg; d[k + 2] = sb; d[k + 3] = Math.max(0, Math.min(255, 0.94 * s * 255 + (rn() - 0.5) * 2));
  }
  g.putImageData(id, 0, 0);
  c.style.width = "1920px"; c.style.height = "1080px";
  return c;
}

/* ------------------------------------------------------------------ the method at scale: overlays in world units */
function worldCanvas(h, rect, res) {
  const cv = document.createElement("canvas");
  cv.width = Math.round(rect.w * res); cv.height = Math.round(rect.h * res);
  cv.style.cssText = `position:absolute;display:block;left:${rect.x}px;top:${rect.y}px;width:${rect.w}px;height:${rect.h}px;visibility:hidden;opacity:0`;
  h.world.insertBefore(cv, h.svg);
  return cv;
}
// 89 of the 203 On-prem connections are in use (truth.json connections_onprem.used); which parcels is illustrative
function connCanvas(h) {
  const rect = { x: 250, y: 770, w: 590, h: 225 }, res = 2, cv = worldCanvas(h, rect, res), ctx = cv.getContext("2d");
  const rn = R.mulberry32(909), ids = W.conn.parcels.map((p) => p.id).filter((id) => id !== RT.db);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(rn() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  const lit = [RT.db].concat(ids.slice(0, TRUTH.connections_onprem.used - 1));
  R.parcels(ctx, rect, res, lit, { fill: T.inUse, alpha: 0.3 });
  R.bloomCells(ctx, lit.map((id) => R.parcel(id).p), T.inUse, 0.22, 12, rect, res);
  cv.__n = lit.length;
  return cv;
}
// 587 products (truth.json apps.multi_app.products) have no canvas of their own (critique 2026-10-21: 587 faint
// strands read as a smudge at 720p): their count stands beside the generators -> front ends bridge, the crossing
// at the "?" that is the picture of a generator joined to its front end
// 2,773 files used by apps people use (truth.json qvd_files.by_usage valid): the land's "valid" cells, lit
function filesCanvas(h) {
  const rect = { x: 850, y: 740, w: 960, h: 260 }, res = 2, cv = worldCanvas(h, rect, res), ctx = cv.getContext("2d");
  const xf = (p) => [(p[0] - rect.x) * res, (p[1] - rect.y) * res];
  const cells = [];
  let files = 0;
  R.land(ctx, { xf, s: res, gap: 0, gapAlpha: 0, only: (ct) => ct.cells.some((cl) => cl.u === "valid"),
    style: (cl) => {
      if (cl.u !== "valid") return null;
      cells.push(cl.poly); files += cl.files;
      return { ground: T.rgba(T.inUse, 0.07), rgb: T.inUse, lum: 0.2, add: false, minTile: 3.4 * res, minGrain: 2.0 * res,
        gap: 0.8 * res, gapK: 0.32, dotK: 0.5, cover: 0.7, jx: 0.5, jy: 0.08 };
    } });
  R.bloomCells(ctx, cells, T.inUse, 0.2, 10, rect, res);
  cv.__n = files;
  return cv;
}

/* ------------------------------------------------------------------ S08's lit list, kept across the click (s0-s3) */
// S08 ends on the 89 connections in use lit above the dim veil (its overlay "ov", moved by the camera): the same pick
// (mulberry32(909), Fisher-Yates, SALES_DB first, = connCanvas above), drawn as s08.html draws it: all 203 in
// --no-sign, the 88 others in its K batches by the time they lit, the bloom of all 89, SALES_DB as S07 lit it.
// Returns the overlay; it fades as the camera leaves for ROUTE (s4) and s5 brings the 89 back as the recap
function s08List(h) {
  const ov = document.createElement("div");
  ov.style.cssText = "position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0;pointer-events:none";
  h.container.insertBefore(ov, h.labelsEl);                              // above the veil (not dimmed), under the names
  gsap.set(ov, R.camera("diary"));
  const conn = W.conn.parcels, ids = conn.map((p) => p.id).filter((id) => id !== RT.db), rn = R.mulberry32(909);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(rn() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  const used = [RT.db].concat(ids.slice(0, TRUTH.connections_onprem.used - 1)).map((id) => R.parcel(id));
  const cvs = [];
  const worldCv = (rect, res) => {
    const cv = document.createElement("canvas"); cv.width = Math.round(rect.w * res); cv.height = Math.round(rect.h * res);
    cv.style.cssText = `position:absolute;left:${rect.x}px;top:${rect.y}px;width:${rect.w}px;height:${rect.h}px`;
    ov.appendChild(cv); cvs.push(cv); return cv;
  };
  const tileRect = { x: 255, y: 772, w: 578, h: 220 }, tres = 2;
  const tiles = (cv, list, fill, alpha) => {
    const ctx = cv.getContext("2d");
    R.parcels(ctx, tileRect, tres, list, { fill, alpha });
    R.parcels(ctx, tileRect, tres, list, { stroke: T.sea, width: 1.4 });
  };
  tiles(worldCv(tileRect, tres), conn, T.noSign, 0.6);
  // S08's batches (its tau / batchOf), each filled then outlined, in the order they lit: one canvas, same pixels
  const N = used.length, A = 2.2, K = 10;
  const tau = (i) => A * Math.sqrt((i - 1) / (N - 2)), batchOf = (i) => Math.min(K - 1, Math.floor((tau(i) / A) * K));
  const batches = Array.from({ length: K }, () => []);
  for (let i = 1; i < N; i++) batches[batchOf(i)].push(used[i]);
  const usedCv = worldCv(tileRect, tres);
  for (const list of batches) tiles(usedCv, list, T.inUse, 1);
  const bloomRect = { x: 230, y: 750, w: 640, h: 270 };
  R.bloomCells(worldCv(bloomRect, 2).getContext("2d"), used.map((p) => p.p), T.inUse, 0.55, 16, bloomRect, 2);
  const dbRect = { x: RT.DB[0] - 60, y: RT.DB[1] - 50, w: 120, h: 100 }, dctx = worldCv(dbRect, 2).getContext("2d");
  R.bloomCells(dctx, [used[0].p], T.inUse, 1, 14, dbRect, 2, 8);
  R.parcels(dctx, dbRect, 2, [RT.db], { fill: T.inUse, alpha: 0.95 });
  ov.__cvs = cvs; ov.__n = N;
  return ov;
}

/* ------------------------------------------------------------------ build */
(async () => {
  const h = await WorldStage.mount($("#ws"), { cam: "diary", state: "S06-end" });
  h.setState("dim");                                                     // = S08's end: the world dim behind the diary
  h.veil.style.willChange = "opacity";                                   // its own layer, as in S08 (s4 fades it twice)
  const L = h.labels, lbl = (id) => L.get(id);

  // S08's end, carried over: its lit list (overlay over the veil) and its count block in place of the island's name

  const cblock = $("#cblock");

  { const cb = R.bb(W.conn.poly), cTL = scr([cb[0], cb[3]], R.camera("diary"));   // = s08.html: under the island's west coast

  const SP = 6;                                                           // the space between a name and its qualifier

    db: [DB[0] - wOf(C.db) / 2, DB[1] + 16],

    cont: [scR - wOf(C.contQ) - SP - wOf(C.cont), scBot + 14 + hOf(C.file) + 8],

  };
  const place = (el, xy) => gsap.set(el, { x: xy[0], y: xy[1] });
  place(C.fileQ, [TG.file[0] - SP - wOf(C.fileQ), TG.file[1]]);
  place(C.contQ, [scR - wOf(C.contQ), TG.cont[1]]);
  place(C.feQ, [TG.fe[0] + wOf(C.fe) + SP, TG.fe[1]]);

  // ---- the count labels of the method at scale (camera full: world = screen). "587 products" stands beside the
  // generators -> front ends bridge (its east end), "2,773 files" on the sea above the land: one shared left edge
  const count = (html, at, ax, ay) => { const d = document.createElement("div"); d.className = "w-label"; d.dataset.plate = "1"; d.innerHTML = html; $("#counts").appendChild(d);
    gsap.set(d, { x: Math.round(at[0] - ax * d.offsetWidth), y: Math.round(at[1] - ay * d.offsetHeight) }); return d; };
  const connAt = lbl("connections").__L.at, GF = W.bridges.gf, CX = Math.round(GF.b[0] + 26);
  const N = {
    conn: count(`<b>Data connections</b><span class="w-dim"> · </span><span class="num">${TRUTH.connections_onprem.used}</span><span class="w-dim"> in use</span>`, connAt, 0.5, 0.5),
    lane: count(`<span class="num">${TRUTH.apps.multi_app.products}</span> products<span class="w-dim"> · generators joined to their front ends</span>`, [CX, GF.b[1]], 0, 0.5),
    files: count(`<span class="num">${validFiles.toLocaleString("en-GB")}</span> files<span class="w-dim"> used by apps people use</span>`, [CX, 724], 0, 0.5),
  };

  // ---- MATCH: the talk's one Living Typography word, slammed over the route, then collapsed onto the file
  const M = $("#match"), MW = M.offsetWidth, MH = M.offsetHeight;
  const MC = [1386, 540];
  gsap.set(M, { x: MC[0] - MW / 2, y: MC[1] - MH / 2 });

  /* ---------------------------------------------------------------- s0: = S08's end */
  // the front end's diary is off stage until s2: it waits laid out as it arrives (LOAD's note open)
  const s0 = { gen: LY.s0.gen, fe: LY.s2.fe };
  for (const id of ["gen", "fe"]) S[id].rows.forEach((r, i) => gsap.set(r.el, { y: s0[id].ys[i] }));
  gsap.set(S.gen.el, { y: TOP }); gsap.set(S.gen.paper, { height: s0.gen.h }); gsap.set(S.fe.paper, { height: LY.s2.fe.h });
  gsap.set(S.fe.el, { y: 1120, autoAlpha: 0 });
  for (const sh of Object.values(S)) for (const r of sh.rows) if (r.key) {
    gsap.set(r.band, { scaleX: 0, backgroundColor: r.key === "let" ? COL.greyTint : COL.useTint });

  }

  gsap.set([dbR.no, dbR.note], { color: COL.red }); gsap.set(dbR.note, { autoAlpha: 1 }); gsap.set(dbR.tx, { color: COL.ink });
  // the sheets' own ground waits for s1: S08 ends on the open sea, with no ground under its sheet

  gsap.set(lveilImg, { autoAlpha: 0 });
  gsap.set(routeG, { autoAlpha: 0 });
  for (const b of Object.values(bridge)) { gsap.set(b.strokes, { drawSVG: "0% 0%" }); gsap.set(b.arrow, { autoAlpha: 0 }); }
  gsap.set([...Object.values(dots), cont, fileG], { autoAlpha: 0 });

  gsap.set(Object.values(C), { autoAlpha: 0 });

  // ---- the measurements s4 needs, taken at s4's compact layout (no notes), then back to s0
  const at4 = () => { for (const id of ["gen", "fe"]) S[id].rows.forEach((r, i) => gsap.set(r.el, { y: LY.s4[id].ys[i] })); gsap.set(S.fe.el, { y: feTop("s4") }); };

  const rectOf = (el) => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect(); };

  const srcEl = { gen: S.gen.title, fe: S.fe.title, db: dbR.names.db, cont: rowOf(S.gen, "store").names.cont, file: rowOf(S.gen, "store").names.file };

  let u = T4 + 1.3;
  fly("gen", u, 0.85);
  kindle(dots.G, u + 0.9);
  fly("db", u + 0.2, 0.85);
  draw("db", u + 0.45, 0.85);
  kindle(dots.DB, u + 1.25);
  // 2.3  STORE: the generator saved this one file, in this container (a project folder)
  u = T4 + 2.3;
  fly("cont", u, 0.95);
  fly("file", u + 0.1, 0.95);
  draw("store", u + 0.15, 1.05);
  tl.to(cont, { autoAlpha: 1, duration: 0.5, ease: E.light }, u + 0.9);
  kindle(fileG, u + 1.15);
  tl.to([C.fileQ, C.contQ], { autoAlpha: 1, duration: 0.45, ease: E.light }, u + 1.35);
  // 3.35  LOAD: the front end reads the same file
  u = T4 + 3.35;
  fly("fe", u, 0.9, TG.gen[1] - 72);
  draw("load", u + 0.1, 0.95);
  kindle(dots.F, u + 1.0);
  tl.to(C.feQ, { autoAlpha: 1, duration: 0.4, ease: E.light }, u + 1.15);
  // 4.6  the key moment: the same name in both diaries, underlined red; two red rules converge on the file; MATCH
  u = T4 + 4.6;
  const ulEls = [rowOf(S.gen, "store").names.file.querySelector("i"), rowOf(S.fe, "load").names.file.querySelector("i")];
  tl.to(ulEls[0], { scaleX: 1, duration: 0.35, ease: E.mark }, u);
  tl.to(ulEls[1], { scaleX: 1, duration: 0.35, ease: E.mark }, u + 0.15);

  tl.to(rules, { drawSVG: "0% 100%", duration: 0.6, ease: "power2.in" }, u + 0.4);

  tl.to(h.veil, { autoAlpha: 0.5, duration: 0.15, ease: "power2.out" }, MT - 0.05);
  tl.fromTo(M, { scale: 1.45, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.2, ease: "power4.in", immediateRender: false }, MT);
  tl.to(M, { scale: 1.025, duration: 0.08, ease: "power2.out" }, MT + 0.2);
  tl.to(M, { scale: 1, duration: 0.25, ease: "power2.inOut" }, MT + 0.28);
  tl.fromTo(fileMark, { attr: { fill: T.rgb(T.inUse) } }, { attr: { fill: T.rgb(T.key) }, duration: 0.1, immediateRender: false }, MT);
  pings.forEach((p, i) => tl.fromTo(p, { attr: { r: 4 }, autoAlpha: 1, strokeWidth: 2.6 }, { attr: { r: 38 + i * 16 }, autoAlpha: 0, strokeWidth: 0.6, duration: 0.95 + i * 0.2, ease: "power2.out", immediateRender: false }, MT + 0.05 + i * 0.12));
  // nothing else red in that frame: the rules go as the word lands, the underlines cool after it
  tl.to(rules, { autoAlpha: 0, duration: 0.18, ease: E.light }, MT);
  tl.to(ulEls, { backgroundColor: COL.useLine, duration: 0.18, ease: E.light }, MT);
  // it holds (about 1.2 s at full size: through Teams at a low frame rate it must last more than a few frames),
  // then collapses onto the file
  const MX = gsap.getProperty(M, "x"), MY = gsap.getProperty(M, "y"), HOLD = 1.2;
  tl.to(M, { x: FL[0] - MW / 2, y: FL[1] - MH / 2, scale: 0.04, duration: 0.55, ease: "power3.in" }, MT + HOLD);
  tl.to(M, { autoAlpha: 0, duration: 0.12, ease: "none" }, MT + HOLD + 0.45);
  tl.to(h.veil, { autoAlpha: 0, duration: 0.5, ease: E.light }, MT + HOLD + 0.15);
  tl.to(fileMark, { attr: { fill: T.rgb(T.inUse) }, duration: 0.6, ease: E.light }, MT + HOLD + 0.6);
  // so the generator and the front end belong together: the bridge over the "?", which goes when it lands
  u = MT + HOLD + 0.35;                                                  // as it collapses
  draw("gf", u, 0.9);
  tl.to(h.q, { autoAlpha: 0, duration: 0.4, ease: E.light }, u + 0.8);
  tl.addLabel("s4", u + 1.35);

  // ---- s5: the method at scale (continuous). The diaries are put away, the camera goes to full, S06's dashed
  // links come back and turn solid one by one (Data connections, the land, the "?" last), each lighting what it
  // found: 89 connections in use, 2,773 used files, 587 products. The world rests in exactly "S09-end"
  const T5 = u + 1.4;
  tl.to(Object.values(S).map((s) => s.el), { x: -1060, duration: 0.75, ease: E.drop, stagger: 0.05 }, T5);
  tl.set(Object.values(S).map((s) => s.el), { autoAlpha: 0 }, T5 + 0.85);
  // the sheets' ground goes with them, before the camera is under way (fewer full-frame layers change mid-dolly)
  tl.to(lveilImg, { autoAlpha: 0, duration: 0.5, ease: E.light }, T5 + 0.2);
  tl.to(Object.values(C), { autoAlpha: 0, duration: 0.25, ease: E.light }, T5);
  tl.to(routeG, { autoAlpha: 0, duration: 0.45, ease: E.light }, T5);
  // the headline keeps a ground of its own while the map passes under it (gone once it rests on open sea)
  const tplate = $("#tplate"), tr = document.createRange();
  tr.selectNodeContents($(".scene-title")); gsap.set(tplate, { width: Math.round(tr.getBoundingClientRect().width + 20) });
  tl.to(tplate, { autoAlpha: 1, duration: 0.3, ease: E.light }, T5 + 0.1);
  // the camera: the four Auditor islands keep their names through the move (h.sync re-anchors them every frame);
  // the rest of the city's names come back as it settles
  const DOL = T5 + 0.5;
  tl.to(h.world, { ...R.camera("full"), duration: 1.45, ease: E.dolly, onUpdate: h.sync }, DOL);
  tl.to(tplate, { autoAlpha: 0, duration: 0.4, ease: E.light }, DOL + 1.1);
  // the Apps pair take their names back from the route's chips as the move starts, and ride it too
  const pair = ["generators", "frontends"];
  tl.to(pair.map(lbl), { autoAlpha: 1, duration: 0.4, ease: E.light }, DOL);
  tl.to([...atDiary.filter((id) => id !== "connections" && !atRoute.includes(id) && !pair.includes(id)).map(lbl), ...terr],
    { autoAlpha: 1, duration: 0.5, stagger: 0.03 }, DOL + 1.1);
  tl.to(h.layers.owners, { autoAlpha: 1, duration: 0.5, ease: E.light }, DOL + 1.4);
  // S06's dashes return (the second port with them, still dashed), then each one is drawn solid
  tl.to(h.layers.needed, { autoAlpha: 1, duration: 0.45, ease: E.light }, DOL + 1.0);
  const turn = (id, t0, dur) => {
    tl.set(BG[id], { autoAlpha: 1 }, t0);
    tl.to(BP[id], { drawSVG: "0% 100%", duration: dur, ease: E.beam }, t0);
    tl.to(ND[id], { autoAlpha: 0, duration: 0.25, ease: E.light }, t0 + dur * 0.6);
  };
  const B0 = DOL + 1.55;
  tl.set(h.layers.bridged, { autoAlpha: 1 }, B0);
  // Data connections -> its 89 in use
  turn("conn", B0, 0.5);
  tl.to(R.fz(connCv), { autoAlpha: 1, duration: 0.6, ease: E.light }, B0 + 0.3);
  tl.to(N.conn, { autoAlpha: 1, duration: 0.45 }, B0 + 0.45);
  // the land -> the second port is built; its 2,773 used files
  turn("land", B0 + 0.55, 0.5);
  tl.to(bridgedPort, { autoAlpha: 1, duration: 0.35, ease: E.light }, B0 + 0.9);
  tl.to(h.ports.missing, { autoAlpha: 0, duration: 0.35, ease: E.light }, B0 + 0.9);
  tl.to(R.fz(filesCv), { autoAlpha: 1, duration: 0.6, ease: E.light }, B0 + 0.85);
  tl.set(lbl("containers"), { attr: { "data-plate": "1" } }, B0 + 0.85);   // over lit cells now: its plate on day
  tl.to(N.files, { autoAlpha: 1, duration: 0.45 }, B0 + 1.0);
  // the "?" last: generators joined to their front ends, 587 products
  turn("gf", B0 + 1.15, 0.45);
  tl.to(N.lane, { autoAlpha: 1, duration: 0.45 }, B0 + 1.45);
  tl.to(h.layers.needed, { autoAlpha: 0, duration: 0.1, ease: "none" }, B0 + 1.65);   // = "S09-end": needed out
  tl.to("#foot", { autoAlpha: 1, duration: 0.5 }, B0 + 1.6);
  tl.addLabel("s5", B0 + 2.2);

  window.__s09 = { h, S, C, N, TG, ov, cblock, M: { MW, MH, MX, MY }, ulS, ulL, rules, MT, T4, T5 };
  await $("#icon").decode().catch(() => {});
  Scene.init(tl, ["s0", "s1", "s2", "s3", "s4", "s5"]);
})();
</script>
</body>
