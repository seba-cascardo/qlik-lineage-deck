<title>S07 · Then came a smaller question</title>
<!--
  S07 (storyboard v4 "Then came a smaller question"; Task 9 of docs/plans/2026-10-20-night-map-deck.md, on the A2
  city of docs/superpowers/specs/2026-10-20-world-cadastre-design.md). Built on deck/shared/world/SCENE_BRIEF.md.
    s0  S06's end dimmed (contract), at S06's own camera CAM6 (s06.html: zoom 0.78, the city to the left): the city
        with its needed links and half the owners, as S06 places them at CAM6, under the veil; the headline
    s1  the camera dollies CAM6 -> conn; every connection parcel is traced (they exist), one lights up;
        the headline becomes the smaller question
    s2  the Azure migration: a new, still empty plot in the west sea; copies of connections travel to it, land, dim
        and get the dashboard's "not used" dash; "Migrating an unused connection = effort with no value"
    s3  the camera pans west so the dashboard and the island get separate zones; a colleague's dashboard: a list
        with ticks; its SALES_DB row ticks "used" and the lit parcel turns in-use
    s4  a clean screen: the camera back to full, the world deeply dimmed, the one connection still lit and
        "How did it know?" alone in --key (Bold; not Living Typography). S08 starts from a dim world
  The lit parcel is c51, WORLD.route.db: the SALES_DB of S08's LIB CONNECT line and S09's traced route.
  Its own world layer (#top) sits above the veil, so the lit parcel and the traced island are not dimmed by it.
-->
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/world/world.css">
<script src="../shared/world/theme.js"></script>
<script src="../shared/world/data.js"></script>
<style>
  body.scene { background: var(--stage); color: var(--ink); }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--stage); }
  #ws { position: absolute; inset: 0; }
  .scene-title { left: 96px; top: 41px; line-height: 70px; color: var(--ink); white-space: nowrap;   /* ink from y 54, x 96 */
    text-shadow: 0 0 2px var(--stage), 0 0 6px var(--stage), 0 0 14px var(--stage); }
  /* the question over the dimmed apps (camera conn): a feathered pool of the stage under the words, as .w-label */
  .s7-pool { isolation: isolate; }
  .s7-pool::before { content: ""; position: absolute; inset: 2px -22px 0 -22px; z-index: -1; border-radius: 30px;
    background: color-mix(in srgb, var(--stage) 72%, transparent);
    box-shadow: 0 0 34px 18px color-mix(in srgb, var(--stage) 72%, transparent); }
  [data-theme="day"] .s7-pool::before { background: color-mix(in srgb, var(--stage) 80%, transparent);
    box-shadow: 0 0 34px 18px color-mix(in srgb, var(--stage) 80%, transparent); }
  #note { position: absolute; right: 184px; top: 1012px; }
  .s7-at { position: absolute; left: 0; top: 0; }

  /* s2: the statement, on the open sea under the island */
  #say { position: absolute; left: 96px; top: 842px; font-size: 40px; line-height: 50px; font-weight: 500;
    color: var(--ink); white-space: nowrap; text-shadow: 0 0 2px var(--stage), 0 0 6px var(--stage), 0 0 14px var(--stage); }
  #pan { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  #say > div { will-change: transform; }

  /* s3: a colleague's dashboard (a list with ticks) on its own plate */
  #dash { position: absolute; left: 1424px; top: 470px; width: 400px; box-sizing: border-box; padding: 18px 22px 18px;
    border-radius: 14px; background: color-mix(in srgb, var(--ink) 6%, var(--stage));
    border: 2px solid color-mix(in srgb, var(--ink) 18%, var(--stage));
    box-shadow: 0 0 28px 8px color-mix(in srgb, var(--stage) 80%, transparent); font-family: "Vodafone", system-ui, sans-serif; }
  #dash .cap { font-size: 24px; line-height: 30px; color: var(--ink-dim); font-weight: 500; }
  #dash .head { display: flex; justify-content: space-between; font-size: 24px; line-height: 30px; color: var(--ink-faint);
    margin-top: 12px; padding: 8px 0 6px; border-top: 2px solid color-mix(in srgb, var(--ink) 16%, var(--stage)); }
  #dash .row { position: relative; display: flex; align-items: center; justify-content: space-between; height: 42px; }
  #dash .row .hl { position: absolute; inset: 2px -12px; border-radius: 8px; background: color-mix(in srgb, var(--in-use) 18%, transparent);
    box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--in-use) 70%, transparent); visibility: hidden; opacity: 0; }
  #dash .row .hl { inset: 2px -10px; }
  #dash .bar { position: relative; display: block; height: 12px; border-radius: 6px; background: color-mix(in srgb, var(--ink-faint) 42%, transparent); }
  #dash .nm { position: relative; font-size: 28px; line-height: 30px; font-weight: 500; color: var(--ink); letter-spacing: 0.01em; }
  #dash svg.mk { position: relative; width: 30px; height: 30px; overflow: visible; margin-right: 4px; }
  .tick { fill: none; stroke: var(--in-use); stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
  .dash { fill: none; stroke: var(--ink-faint); stroke-width: 3; stroke-linecap: round; }
  #lead { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
  #lead .ln { fill: none; stroke: var(--in-use); stroke-width: 2.5; stroke-linecap: round; }
  #lead .dt { fill: var(--in-use); }

  /* s4: the one red sentence */
  #hero { position: absolute; left: 85px; top: 40px; }   /* the H's ink on x 96 (measured: the glyph's side bearing is 11 px) */
</style>
</head>
<body class="scene">
<div id="stage">
  <div id="ws"></div>
  <h1 class="scene-title" id="t0">Then came a smaller question</h1>
  <h1 class="scene-title s7-pool" id="t1">Which data connections are actually used?</h1>
  <div id="pan">
    <div id="lconn" class="w-label s7-at"><b>Data connections</b></div>
    <div id="lazure" class="w-label s7-at"><b>Azure</b></div>
  </div>
  <div id="say"><div class="l1">Migrating an unused connection</div><div class="l2">= effort with no value</div></div>
  <svg id="lead" viewBox="0 0 1920 1080"><path class="ln" id="leadLn"/><circle class="dt" id="leadDt" r="5"/></svg>
  <div id="dash">
    <div class="cap">A colleague’s dashboard</div>
    <div class="head"><span>Data connection</span><span>Used</span></div>
  </div>
  <div id="hero" class="w-hero">How did it know?</div>
  <div id="note" class="w-note">Illustrative layout · real counts</div>
  <img class="vf-icon" id="icon" alt="Vodafone">
</div>
<script src="../shared/vendor/gsap.min.js"></script>
<script src="../shared/vendor/DrawSVGPlugin.min.js"></script>
<script src="../shared/vendor/MotionPathPlugin.min.js"></script>
<script src="../shared/scene-runtime.js"></script>
<script src="../shared/world/world.js"></script>
<script src="../shared/world/stage.js"></script>
<script>
const R = window.WorldRender, T = window.THEME, W = window.WORLD;
gsap.registerPlugin(DrawSVGPlugin, MotionPathPlugin);
document.querySelector("#icon").src = T.icon;
const NS = "http://www.w3.org/2000/svg";
const $ = (s) => document.querySelector(s);
function svgEl(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }

// ---- S06's resting camera (s06.html CAM6, copied: shared files and other scenes are read-only): the city at 0.78,
// its Apps label on x 96. S07 starts here, so the player's cross-fade keeps the city in place.
const S6 = 0.78;
const CAM6 = { x: +(96 * (1 - S6)).toFixed(2), y: 125, scale: S6 };
// the map covers every camera the scene rests on, padded 40 (SCENE_BRIEF §4): full and CAM6, as S06's does
// (conn, zoom 2, lies inside full)
function seen(c) { return [-c.x / c.scale, -c.y / c.scale, (1920 - c.x) / c.scale, (1080 - c.y) / c.scale]; }
const RECT = (() => {
  const vf = seen(R.camera("full")), v6 = seen(CAM6);
  const x0 = Math.floor(Math.min(vf[0], v6[0]) - 40), y0 = Math.floor(Math.min(vf[1], v6[1]) - 40);
  const x1 = Math.ceil(Math.max(vf[2], v6[2]) + 40), y1 = Math.ceil(Math.max(vf[3], v6[3]) + 40);
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
})();
const PAN = 170;   // s3: the camera pans west so the island's east tip clears the dashboard (separate zones)

(async () => {
  const ws = $("#ws");
  // ---- the world: S06's end, dimmed (scene contract)
  const h = await WorldStage.mount(ws, { rect: RECT, state: "S06-end" });
  h.setState("dim");
  // the veil on its own compositor layer: the dollies under it ran ~10 % faster at 4x throttle (measured A/B)
  h.veil.style.willChange = "opacity";
  const CONN = R.camera("conn"), FULL = R.camera("full");
  const CAM3 = { x: CONN.x - PAN, y: CONN.y, scale: CONN.scale };
  const toScreen = (p, v = CONN) => [v.x + v.scale * p[0], v.y + v.scale * p[1]];
  const pt = (p) => p[0].toFixed(1) + "," + p[1].toFixed(1);

  // ---- S06's end as S06 draws it at CAM6 (s06.html, same code): the gf crossing re-cut for the "?" at CAM6
  h.place(CAM6);
  const ink6 = h.q.__ink.map((s, i) => (s - (i % 2 ? CAM6.y : CAM6.x)) / S6);
  h.place("full");
  const gfFull = h.bridges.gf;                       // the shared cut (camera full) returns for s4, as S08 starts
  const gf6 = R.neededGF(h.layers.needed, W.bridges.gf, ink6).g;
  gsap.set(gfFull, { autoAlpha: 0 });

  // ---- and the owner marks as S06 leaves them at CAM6: counter-scaled to their camera-full size, and those that
  // touch a label plate at CAM6 moved to the nearest clear parcel of their district. On a copy of the owners layer,
  // so the shared marks stay as they are for s4 (camera full)
  const own6L = h.layers.owners.cloneNode(true);
  h.layers.owners.after(own6L);
  const own = [...h.owners.entries()].map(([id, o]) => ({ id, at: o.at, g: own6L.querySelector(`[data-owner="${id}"]`) }));
  const ownOf = new Map(own.map((o) => [o.id, o]));
  {
    const RING = 9;
    const toS = (p) => [CAM6.x + S6 * p[0], CAM6.y + S6 * p[1]];
    h.place(CAM6);
    const plates6 = [...h.labels.values()].map((el) => {
      if (el === h.q) return h.q.__ink.slice();
      const Lb = el.__L, w = el.offsetWidth, ht = el.offsetHeight;
      const s = toS(Lb.at), x = s[0] - Lb.ax * w, y = s[1] - Lb.ay * ht;
      return [x - 22, y - 12, x + w + 22, y + ht + 12];
    });
    h.place("full");
    const hitsPlate = (p) => { const s = toS(p); return plates6.some((b) => s[0] > b[0] - RING && s[0] < b[2] + RING && s[1] > b[1] - RING && s[1] < b[3] + RING); };
    const edgeD = (p, poly) => { let m = 1e9; for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length];
      const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy || 1, u = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L));
      m = Math.min(m, Math.hypot(a[0] + u * dx - p[0], a[1] + u * dy - p[1])); } return m; };
    const ends = [...W.ports.map((p) => p.at), ...W.bridges.known.flatMap((b) => [b.a, b.b]), ...W.bridges.needed.flatMap((b) => [b.a, b.b]), W.bridges.gf.a, W.bridges.gf.b];
    for (const key of ["generators", "frontends"]) {
      const I = W.apps[key];
      I.streams.forEach((s, si) => {
        const o = ownOf.get(s.id);
        if (!o || !hitsPlate(o.at)) return;
        const others = own.filter((q) => q !== o).map((q) => q.at);
        const cand = I.parcels.filter((p) => p.s === si).map((p) => p.c)
          .sort((a, b) => Math.hypot(a[0] - o.at[0], a[1] - o.at[1]) - Math.hypot(b[0] - o.at[0], b[1] - o.at[1]));
        const clear = (p, edge, end, gap) => R.inside(p, s.poly) && edgeD(p, s.poly) >= edge && !hitsPlate(p)
          && ends.every((e) => Math.hypot(p[0] - e[0], p[1] - e[1]) >= end) && others.every((q) => Math.hypot(p[0] - q[0], p[1] - q[1]) >= gap);
        const tiers = [[RING / S6, 36, 28], [6, 30, 20], [4, 0, 16], [0, 0, 0]];
        let p = null;
        for (const [edge, end, gap] of tiers) { p = cand.find((c) => clear(c, edge, end, gap)); if (p) break; }
        if (!p) return;
        for (const c of o.g.querySelectorAll("circle")) { c.setAttribute("cx", p[0]); c.setAttribute("cy", p[1]); }
        o.at = p;
      });
    }
    for (const o of own) {
      o.g.setAttribute("transform", `translate(${pt(o.at).replace(",", " ")}) scale(${(1 / S6).toFixed(4)}) translate(${(-o.at[0]).toFixed(1)} ${(-o.at[1]).toFixed(1)})`);
    }
  }
  gsap.set(h.layers.owners, { autoAlpha: 0 });       // the shared marks wait for s4 (camera full)
  gsap.set(h.world, CAM6);
  h.place(CAM6);

  // ---- this scene's own world layer, above the veil and under the labels: moved by the same camera as h.world
  const top = document.createElement("div");
  top.style.cssText = "position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0";
  ws.insertBefore(top, h.labelsEl);
  gsap.set(top, CAM6);

  const DB = W.route.db;                                 // "c51": SALES_DB (S08's LIB CONNECT, S09's route)
  const db = R.parcel(DB);
  const rect = { x: 96, y: 760, w: 780, h: 250 }, res = 2;   // Data connections + the west sea (Azure), at zoom <= 2
  function canvas(r = rect) {
    const cv = document.createElement("canvas");
    cv.width = r.w * res; cv.height = r.h * res;
    cv.style.cssText = `position:absolute;left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`;
    top.appendChild(cv);
    return cv;
  }
  // every connection traced: Qlik lists them all (they exist), none says whether it is used
  const cvAll = canvas();
  {
    const ctx = cvAll.getContext("2d");
    R.parcels(ctx, rect, res, W.conn.parcels, { fill: T.inkFaint, alpha: 0.05 });
    R.parcels(ctx, rect, res, W.conn.parcels, { stroke: T.inkFaint, width: 1, alpha: 0.3 });
    R.parcels(ctx, rect, res, [{ poly: W.conn.poly }], { stroke: T.inkFaint, width: 1, alpha: 0.4 });
  }
  // the one connection, lit (a connection's light, THEME.app), then in use (THEME.inUse) once the dashboard says so.
  // Cropped to the parcel plus its bloom (blur 14 = sigma; 3 sigma + 6), so the dolly back scales a small image
  const rLit = (() => {
    const xs = db.p.map((q) => q[0]), ys = db.p.map((q) => q[1]), m = 48;
    const x0 = Math.floor(Math.min(...xs) - m), y0 = Math.floor(Math.min(...ys) - m);
    return { x: x0, y: y0, w: Math.ceil(Math.max(...xs) + m) - x0, h: Math.ceil(Math.max(...ys) + m) - y0 };
  })();
  const cvLit = canvas(rLit);
  {
    const ctx = cvLit.getContext("2d");
    R.bloomCells(ctx, [db.p], T.app, 0.9, 12, rLit, res, 7);
    R.parcels(ctx, rLit, res, [DB], { fill: T.app, alpha: 0.92 });
  }
  const cvUse = canvas(rLit);
  {
    const ctx = cvUse.getContext("2d");
    R.bloomCells(ctx, [db.p], T.inUse, 1, 14, rLit, res, 8);
    R.parcels(ctx, rLit, res, [DB], { fill: T.inUse, alpha: 0.95 });
  }
  const svg = svgEl("svg", { width: 1920, height: 1080, viewBox: "0 0 1920 1080" }, top);
  svg.style.cssText = "position:absolute;left:0;top:0;overflow:visible;pointer-events:none";

  // pulse rings round the lit parcel (world units)
  const ring = (colour) => svgEl("circle", { cx: db.c[0], cy: db.c[1], r: 10, fill: "none", stroke: T.rgb(colour), "stroke-width": 1.4 }, svg);
  const ringLit = ring(T.app), ringUse = ring(T.inUse);

  // ---- Azure: a new plot in the west sea, still empty (a dashed coast), where copies of connections travel
  const AZ = { c: [181, 884], rx: 60, ry: 74 };
  const azPoly = [];
  {
    const rnd = R.mulberry32(707), n = 30, ph = rnd() * 6.283;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, k = 1 + 0.045 * Math.sin(3 * a + ph) + 0.03 * Math.sin(5 * a + 2 * ph) + (rnd() - 0.5) * 0.02;
      azPoly.push([AZ.c[0] + Math.cos(a) * AZ.rx * k, AZ.c[1] + Math.sin(a) * AZ.ry * k]);
    }
  }
  const gAz = svgEl("g", {}, svg);
  const azD = "M" + azPoly.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L") + " Z";
  svgEl("path", { d: azD, fill: T.rgba(T.inkFaint, 0.07), stroke: "none" }, gAz);
  svgEl("path", { d: azD, fill: "none", stroke: T.rgba(T.inkDim, 0.85), "stroke-width": 1.2, "stroke-dasharray": "5 4", "stroke-linejoin": "round" }, gAz);
  // copies of four connections from the island's west end travel to it
  // the four on the island's west coast (illustrative: no real connection is implied)
  const picks = W.conn.parcels.slice().sort((a, b) => a.c[0] - b.c[0]).slice(0, 4).sort((a, b) => a.c[1] - b.c[1]);
  const slots = [[163, 878], [199, 878], [163, 918], [199, 918]];
  const ghosts = [], trails = [], srcs = [];
  picks.forEach((p, i) => {
    const [tx, ty] = slots[i], [sx, sy] = p.c;
    const cx = (sx + tx) / 2, cy = Math.min(sy, ty) - 34 - 6 * i;
    const d = `M${sx.toFixed(1)},${sy.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${tx},${ty}`;
    trails.push(svgEl("path", { d, fill: "none", stroke: T.rgba(T.inkDim, 0.5), "stroke-width": 1, "stroke-linecap": "round" }, gAz));
    // the original stays on the island, outlined while its copy leaves
    srcs.push(svgEl("polygon", { points: p.p.map((q) => q.join(",")).join(" "), fill: T.rgba(T.inkFaint, 0.12), stroke: T.rgba(T.ink, 0.8), "stroke-width": 1, "stroke-linejoin": "round" }, gAz));
    const g = svgEl("g", {}, gAz);
    const k = 0.8;   // the copy, slightly smaller, so four fit the plot
    const pts = p.p.map((q) => [((q[0] - sx) * k).toFixed(1), ((q[1] - sy) * k).toFixed(1)].join(",")).join(" ");
    const poly = svgEl("polygon", { points: pts, fill: T.rgba(T.inkFaint, 0.16), stroke: T.rgba(T.ink, 0.85), "stroke-width": 1.1, "stroke-linejoin": "round" }, g);
    // once landed it is struck by the dashboard's "not used" mark (the same dash, --ink-faint, 3 px on screen at conn)
    const no = svgEl("path", { d: "M-6,0 L6,0", fill: "none", stroke: T.rgb(T.inkFaint), "stroke-width": 1.6, "stroke-linecap": "round" }, g);
    gsap.set(g, { x: sx, y: sy });
    ghosts.push({ g, d, poly, no });
  });

  // ---- screen-space text placed for camera conn
  const place = (el, p, ax, ay) => { const [x, y] = toScreen(p); el.style.transform = `translate(${(x - ax * el.offsetWidth).toFixed(1)}px,${(y - ay * el.offsetHeight).toFixed(1)}px)`; };
  place($("#lconn"), [470, 916], 0.5, 0.5);
  place($("#lazure"), [AZ.c[0], AZ.c[1] - AZ.ry - 14], 0.5, 1);

  // ---- the dashboard's rows: masked names (no real connection is implied), SALES_DB second, ticks and dashes
  const ROWS = [{ w: 156, ok: 1 }, { nm: "SALES_DB", ok: 1 }, { w: 196, ok: 0 }, { w: 124, ok: 1 }, { w: 172, ok: 0 }, { w: 140, ok: 0 }];
  const dash = $("#dash"), marks = [], rows = [];
  let dbRow = null;
  for (const r of ROWS) {
    const row = document.createElement("div"); row.className = "row";
    const hl = document.createElement("div"); hl.className = "hl"; row.appendChild(hl);
    if (r.nm) { const s = document.createElement("span"); s.className = "nm"; s.textContent = r.nm; row.appendChild(s); dbRow = row; }
    else { const b = document.createElement("i"); b.className = "bar"; b.style.width = r.w + "px"; row.appendChild(b); }
    const m = document.createElementNS(NS, "svg"); m.setAttribute("class", "mk"); m.setAttribute("viewBox", "0 0 30 30");
    const pth = svgEl("path", r.ok ? { class: "tick", d: "M6 16 L12.5 22 L24 8" } : { class: "dash", d: "M8 15 L22 15" }, m);
    row.appendChild(m);
    dash.appendChild(row); rows.push(row); marks.push(pth);
  }
  // the leader from the SALES_DB row to the parcel (screen px at camera CAM3: conn panned west)
  {
    const dr = dash.getBoundingClientRect(), rr = dbRow.getBoundingClientRect();
    const s = document.body.getBoundingClientRect(), k = s.width / 1920 || 1;
    const ax = (dr.left - s.left) / k - 2, ay = (rr.top + rr.height / 2 - s.top) / k;
    const xs = db.p.map((q) => toScreen(q, CAM3)[0]), ys = db.p.map((q) => toScreen(q, CAM3)[1]);
    const bx = Math.max(...xs) + 10, by = (Math.min(...ys) + Math.max(...ys)) / 2;
    $("#leadLn").setAttribute("d", `M${ax.toFixed(1)},${ay.toFixed(1)} C${(ax - 40).toFixed(1)},${ay.toFixed(1)} ${(bx + 40).toFixed(1)},${by.toFixed(1)} ${bx.toFixed(1)},${by.toFixed(1)}`);
    $("#leadDt").setAttribute("cx", bx.toFixed(1)); $("#leadDt").setAttribute("cy", by.toFixed(1));
  }

  await R.freeze([cvAll, cvLit, cvUse]);
  const imAll = R.fz(cvAll), imLit = R.fz(cvLit), imUse = R.fz(cvUse);
  const labels = [...h.labels.values()];

  // ---- s0: S06's end, dimmed; this scene's overlays hidden
  gsap.set([imAll, imLit, imUse, ringLit, ringUse, gAz, "#lconn", "#lazure", "#say > div", "#lead", dash, "#t1", "#hero"], { autoAlpha: 0 });
  gsap.set(imAll, { clipPath: "inset(0% 100% 0% 0%)" });
  gsap.set([...ghosts.map((o) => o.g), ...srcs], { autoAlpha: 0 });
  gsap.set(ghosts.map((o) => o.no), { drawSVG: "0%" });
  gsap.set(trails, { drawSVG: "0%" });
  gsap.set(marks, { drawSVG: "0%" });
  gsap.set("#leadLn", { drawSVG: "0%" });

  const tl = gsap.timeline({ paused: true });
  tl.addLabel("s0", 0);

  // ---- s1: dolly to Data connections; every connection traced; one lights; the smaller question
  // one thing at a time while the camera moves (the dolly is the heavy frame): fades before it, reveals after it
  tl.to(labels, { autoAlpha: 0, duration: 0.35, ease: "power1.out" }, "s0");
  tl.to(own6L, { autoAlpha: 0, duration: 0.35, ease: "power1.out" }, "s0");   // world units: hidden at zoom > 1
  tl.to(h.veil, { autoAlpha: 0.7, duration: 0.35, ease: R.MOTION.light }, "s0");
  tl.to([h.world, top], { ...CONN, duration: 1.8, ease: R.MOTION.dolly }, "s0+=0.3");
  tl.to("#t0", { autoAlpha: 0, y: -10, duration: 0.5, ease: "power2.in" }, "s0+=0.45");
  tl.to(imAll, { autoAlpha: 1, duration: 0.3, ease: "none" }, "s0+=2.05");
  tl.to(imAll, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.0, ease: "power2.inOut" }, "s0+=2.05");
  tl.fromTo("#t1", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: R.MOTION.rise }, "s0+=2.1");
  tl.to("#lconn", { autoAlpha: 1, duration: 0.5, ease: "power1.out" }, "s0+=2.4");
  tl.to(imLit, { autoAlpha: 1, duration: 0.6, ease: R.MOTION.kindle }, "s0+=2.75");
  tl.set(ringLit, { attr: { r: 10 }, autoAlpha: 0.9 }, "s0+=2.75");
  tl.to(ringLit, { attr: { r: 42 }, autoAlpha: 0, duration: 1.1, ease: "power2.out" }, "s0+=2.75");
  tl.addLabel("s1", "s0+=3.85");

  // ---- s2: the Azure migration
  tl.fromTo(gAz, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6, ease: "power1.out" }, "s1");
  tl.to("#lazure", { autoAlpha: 1, duration: 0.5, ease: "power1.out" }, "s1+=0.3");
  ghosts.forEach((o, i) => {
    const t0 = 0.4 + i * 0.15, t = `s1+=${t0.toFixed(2)}`, landed = `s1+=${(t0 + 1.15).toFixed(2)}`;
    tl.to([o.g, srcs[i]], { autoAlpha: 1, duration: 0.25, ease: "power1.out" }, t);
    tl.to(o.g, { motionPath: { path: o.d }, duration: 1.2, ease: R.MOTION.travel }, t);
    tl.to(trails[i], { drawSVG: "100%", duration: 1.2, ease: R.MOTION.travel }, t);
    // landed: the copy empties out and takes the "not used" dash; its trail fades
    tl.to(o.poly, { autoAlpha: 0.4, duration: 0.4, ease: "power1.inOut" }, landed);
    tl.to(o.no, { drawSVG: "100%", duration: 0.35, ease: R.MOTION.mark }, landed);
    tl.to(trails[i], { autoAlpha: 0.35, duration: 0.5, ease: "power1.inOut" }, landed);
  });
  tl.fromTo("#say > div", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: R.MOTION.rise, stagger: 0.18 }, "s1+=1.95");
  tl.addLabel("s2", "s1+=2.95");

  // ---- s3: the camera pans west (separate zones for the island and the card), then a colleague's dashboard
  tl.to("#say > div", { autoAlpha: 0, duration: 0.4, ease: "power1.in" }, "s2");
  tl.to(gAz, { autoAlpha: 0.3, duration: 0.5, ease: "power1.inOut" }, "s2");
  tl.to("#lazure", { autoAlpha: 0, duration: 0.4, ease: "power1.in" }, "s2");          // it would slide past the margin
  tl.to([h.world, top], { ...CAM3, duration: 1.0, ease: R.MOTION.dolly }, "s2+=0.1");
  tl.to("#pan", { x: -PAN, duration: 1.0, ease: R.MOTION.dolly }, "s2+=0.1");
  const D = 0.75;   // the card after the pan
  tl.fromTo(dash, { autoAlpha: 0, clipPath: "inset(0% 0% 100% 0% round 14px)" },
    { autoAlpha: 1, clipPath: "inset(0% 0% 0% 0% round 14px)", duration: 0.8, ease: R.MOTION.slide }, `s2+=${D + 0.2}`);
  tl.fromTo(rows, { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: R.MOTION.rise, stagger: 0.06 }, `s2+=${D + 0.45}`);
  marks.forEach((m, i) => tl.to(m, { drawSVG: "100%", duration: 0.35, ease: R.MOTION.mark }, `s2+=${(D + 1.05 + i * 0.12).toFixed(2)}`));
  tl.to(dbRow.querySelector(".hl"), { autoAlpha: 1, duration: 0.4, ease: "power1.out" }, `s2+=${D + 1.9}`);
  tl.set("#lead", { autoAlpha: 1 }, `s2+=${D + 2.0}`);
  tl.fromTo("#leadDt", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, `s2+=${D + 2.35}`);
  tl.to("#leadLn", { drawSVG: "100%", duration: 0.5, ease: R.MOTION.beam }, `s2+=${D + 2.0}`);
  tl.to(imUse, { autoAlpha: 1, duration: 0.6, ease: R.MOTION.kindle }, `s2+=${D + 2.45}`);
  tl.to(imLit, { autoAlpha: 0, duration: 0.6, ease: "power1.inOut" }, `s2+=${D + 2.55}`);
  tl.set(ringUse, { attr: { r: 10 }, autoAlpha: 0.9 }, `s2+=${D + 2.45}`);
  tl.to(ringUse, { attr: { r: 42 }, autoAlpha: 0, duration: 1.1, ease: "power2.out" }, `s2+=${D + 2.45}`);
  tl.addLabel("s3", `s2+=${D + 3.4}`);

  // ---- s4: a clean screen; back to the whole city; "How did it know?"
  tl.to([dash, "#lead", gAz, "#lconn", "#t1", imAll], { autoAlpha: 0, duration: 0.4, ease: "power1.in" }, "s3");
  tl.to(h.veil, { autoAlpha: 0.88, duration: 0.4, ease: R.MOTION.light }, "s3");
  tl.set(gf6, { autoAlpha: 0 }, "s3");               // the shared gf cut (camera full), as S08 starts
  tl.set(gfFull, { autoAlpha: 1 }, "s3");
  tl.to([h.world, top], { ...FULL, duration: 1.8, ease: R.MOTION.dolly }, "s3+=0.45");
  tl.to(h.layers.owners, { autoAlpha: 1, duration: 0.4, ease: "power1.out" }, "s3+=2.25");
  tl.fromTo("#hero", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.8, ease: R.MOTION.rise }, "s3+=2.3");
  tl.addLabel("s4", "s3+=3.1");

  await $("#icon").decode().catch(() => {});
  Scene.init(tl, ["s0", "s1", "s2", "s3", "s4"]);
})();
</script>
</body>
</html>
